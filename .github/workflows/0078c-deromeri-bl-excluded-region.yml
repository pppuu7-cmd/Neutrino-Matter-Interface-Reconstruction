name: NMIR 0078c solar-CEvNS B-L excluded region

on:
  push:
    paths:
      - 'scripts/materialize_deromeri_bl_excluded_region_0078c.py'
      - 'research/prereg/0078c_deromeri_bl_excluded_region.md'
      - '.github/workflows/0078c-deromeri-bl-excluded-region.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scientific-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vector topology dependencies
        run: python -m pip install PyMuPDF shapely
      - name: Run frozen 0078c excluded-region materialization
        run: python scripts/materialize_deromeri_bl_excluded_region_0078c.py
      - name: Hash result
        if: always()
        run: |
          if [ -f deromeri_bl_excluded_region_0078c.json ]; then sha256sum deromeri_bl_excluded_region_0078c.json; fi
      - name: Persist complete machine-readable excluded region
        if: success()
        run: |
          cp deromeri_bl_excluded_region_0078c.json data/deromeri_bl_excluded_region_0078c.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/deromeri_bl_excluded_region_0078c.json
          if git diff --cached --quiet; then
            echo 'No result change to commit.'
          else
            git commit -m 'Record complete 0078c solar-CEvNS B-L excluded region'
            git push
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0078c-bl-excluded-region
          path: deromeri_bl_excluded_region_0078c.json
          if-no-files-found: error
