name: 0101 authority payload probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/0101-authority-payload-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe official authority payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe

          DB_BASE='https://journals.aps.org/prl/supplemental/10.1103/PhysRevLett.133.051801'
          UA='Mozilla/5.0 NMIR-authority-probe/1.0'

          echo '=== Daya Bay official supplemental payloads ===' | tee probe/summary.txt
          for f in chiSquareMap_DayaBay_3158days.dat readme.pdf; do
            url="$DB_BASE/$f"
            echo "URL: $url" | tee -a probe/summary.txt
            if curl -A "$UA" -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 "$url" -o "probe/$f"; then
              bytes=$(wc -c < "probe/$f" | tr -d ' ')
              sha=$(sha256sum "probe/$f" | awk '{print $1}')
              echo "FETCH=PASS bytes=$bytes sha256=$sha" | tee -a probe/summary.txt
            else
              echo 'FETCH=FAIL' | tee -a probe/summary.txt
            fi
          done

          echo '=== IceCube Harvard Dataverse metadata ===' | tee -a probe/summary.txt
          DV_API='https://dataverse.harvard.edu/api/datasets/:persistentId/?persistentId=doi%3A10.7910%2FDVN%2FQKL28Z'
          echo "URL: $DV_API" | tee -a probe/summary.txt
          curl -A "$UA" -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 "$DV_API" -o probe/icecube_dataverse.json

          python - <<'PY' | tee -a probe/summary.txt
          import json
          from pathlib import Path

          p = Path('probe/icecube_dataverse.json')
          obj = json.loads(p.read_text())
          data = obj.get('data', {})
          v = data.get('latestVersion', {})
          print('dataset_id=', data.get('id'))
          print('persistent_url=', data.get('persistentUrl'))
          print('version=', f"{v.get('versionNumber')}.{v.get('versionMinorNumber')}")
          print('version_state=', v.get('versionState'))
          files = v.get('files', [])
          print('file_count=', len(files))
          for entry in files:
              df = entry.get('dataFile', {})
              checksum = df.get('checksum') or {}
              print('FILE',
                    'id='+str(df.get('id')),
                    'name='+str(df.get('filename')),
                    'bytes='+str(df.get('filesize')),
                    'type='+str(df.get('contentType')),
                    'checksum_type='+str(checksum.get('type')),
                    'checksum='+str(checksum.get('value')))
          PY

          if [ -s probe/chiSquareMap_DayaBay_3158days.dat ]; then
            echo '=== Daya Bay map text preflight ===' | tee -a probe/summary.txt
            file probe/chiSquareMap_DayaBay_3158days.dat | tee -a probe/summary.txt
            head -n 20 probe/chiSquareMap_DayaBay_3158days.dat | tee probe/dayabay_head.txt
            tail -n 20 probe/chiSquareMap_DayaBay_3158days.dat > probe/dayabay_tail.txt
          fi

          sha256sum probe/* > probe/all_sha256.txt
          cat probe/summary.txt

      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0101-authority-probe
          path: probe/
          if-no-files-found: error
