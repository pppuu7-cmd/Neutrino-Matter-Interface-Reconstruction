name: NMIR pinned solar matter

on:
  workflow_dispatch:
  push:
    paths:
      - "data/solar_matter_manifest.csv"
      - "src/nmir/solar_matter.py"
      - ".github/workflows/matter-materialize.yml"

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NMIR
        run: python -m pip install -e .
      - name: Materialize immutable B16 solar matter tables
        run: |
          mkdir -p artifacts/solar_matter
          python -m nmir.solar_matter artifacts/solar_matter | tee artifacts/solar_matter/DIAGNOSTICS.txt
          test "$(find artifacts/solar_matter -type f -name 'nudistr_b16_*.dat' | wc -l)" -eq 2
      - name: Upload verified matter bundle
        uses: actions/upload-artifact@v4
        with:
          name: nmir-solar-matter-${{ github.sha }}
          path: artifacts/solar_matter/
          if-no-files-found: error
          retention-days: 90
