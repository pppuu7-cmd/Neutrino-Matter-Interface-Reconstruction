name: NMIR v2 0105a6m Zettlemoyer candidate evidence semantic verification

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6m_zettlemoyer_candidate_evidence_semantic_verification_preregistration.md'
      - 'scripts/extract_0105a6m_zettlemoyer_candidate_evidence_windows.py'
      - 'tests/test_0105a6m_zettlemoyer_candidate_evidence_windows.py'
      - '.github/workflows/nmir_v2_0105a6m_zettlemoyer_candidate_evidence_semantic_verification.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bounded-evidence-extraction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check pytest
      - name: Run fail-closed bounded-evidence guards
        run: python -m pytest -q tests/test_0105a6m_zettlemoyer_candidate_evidence_windows.py
      - name: Recover and verify exact 0105a6l parent artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/0105a6m/parent
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10159983173/zip \
            > artifacts/0105a6m/parent/0105a6l.zip
          echo '0eb725afbc38026708b2fdf01c6a7ae77ac69e3c3dcaf7270499d159feff464e  artifacts/0105a6m/parent/0105a6l.zip' | sha256sum -c -
          unzip -q artifacts/0105a6m/parent/0105a6l.zip -d artifacts/0105a6m/parent/unpacked
          echo '914d65886e5885dc017f8d118e1400f583450d2f5a64301007702bd439940317  artifacts/0105a6m/parent/unpacked/result.json' | sha256sum -c -
      - name: Extract only mechanically inherited bounded evidence windows
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/extract_0105a6m_zettlemoyer_candidate_evidence_windows.py \
            --parent-json artifacts/0105a6m/parent/unpacked/result.json \
            --output artifacts/0105a6m/evidence.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6m/stdout.txt
          sha256sum artifacts/0105a6m/evidence.json | tee artifacts/0105a6m/evidence_sha256.txt
      - name: Remove recovered parent before upload
        run: rm -rf artifacts/0105a6m/parent
      - name: Upload bounded evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6m-zettlemoyer-bounded-semantic-evidence
          path: |
            artifacts/0105a6m/evidence.json
            artifacts/0105a6m/evidence_sha256.txt
            artifacts/0105a6m/stdout.txt
          if-no-files-found: warn
