name: NMIR 0083a-r1 Hong B-L branch-scope conformance
on:
  push:
    branches: [main]
    paths:
      - 'research/amendments/0083a_parser_scope_binding_correction.md'
      - 'scripts/audit_hong_bl_branch_scope_0083a_r1.py'
      - 'tests/test_audit_hong_bl_branch_scope_0083a_r1.py'
      - '.github/workflows/0083a-r1-hong-bl-branch-scope.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pytest
      - name: Run dedicated tests
        run: python -m pytest -q tests/test_audit_hong_bl_branch_scope_0083a_r1.py
      - name: Run frozen 0083a-r1 audit
        id: audit
        continue-on-error: true
        run: python scripts/audit_hong_bl_branch_scope_0083a_r1.py
      - name: Hash result
        if: always()
        run: if [ -f hong_bl_branch_scope_0083a_r1.json ]; then sha256sum hong_bl_branch_scope_0083a_r1.json; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0083a-r1-hong-bl-branch-scope
          path: hong_bl_branch_scope_0083a_r1.json
          if-no-files-found: error
      - name: Enforce frozen classification
        if: always()
        run: test "${{ steps.audit.outcome }}" = "success"
