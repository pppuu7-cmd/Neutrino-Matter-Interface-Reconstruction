name: NMIR v2 0105a5b R1j1 PISA methodology archive structure
on:
  push:
    branches: [research/0105-bsm-residual-reconstruction]
    paths:
      - '.github/workflows/nmir_v2_0105a5b_r1j1_pisa_methodology_archive_structure.yml'
      - 'scripts/audit_0105a5b_r1j1_pisa_methodology_archive_structure.py'
      - 'tests/test_0105a5b_r1j1_pisa_methodology_archive_structure.py'
      - 'research/prereg/0105a5b_r1j1_pisa_methodology_archive_structure_preregistration.md'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  archive-structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run R1j1 guards
        run: python -m pytest -q tests/test_0105a5b_r1j1_pisa_methodology_archive_structure.py
      - name: Execute frozen structure locator
        run: |
          mkdir -p artifacts/0105a5b_r1j1
          python scripts/audit_0105a5b_r1j1_pisa_methodology_archive_structure.py --output artifacts/0105a5b_r1j1/result.json --git-sha "$GITHUB_SHA"
          sha256sum artifacts/0105a5b_r1j1/result.json > artifacts/0105a5b_r1j1/result_sha256.txt
      - name: Verify no semantic inspection
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a5b_r1j1/result.json'))
          assert d['source_text_inspected'] is False
          assert d['pisa_repository_content_inspected'] is False
          assert d['standard_3nu_executed'] is False
          assert d['systematic_monte_carlo_executed'] is False
          assert d['observed_bsm_residual_inspected'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a5b-r1j1-pisa-methodology-archive-structure
          path: artifacts/0105a5b_r1j1/
          if-no-files-found: error
          retention-days: 90
