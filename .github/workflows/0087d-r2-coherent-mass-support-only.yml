name: NMIR 0087d-r2 COHERENT B-L mass-support-only authority

on:
  push:
    paths:
      - 'research/prereg/0087d_coherent_mass_support_only_authority.md'
      - 'research/amendments/0087d_bl_semantic_parser_conformance_r2.md'
      - 'scripts/audit_coherent_mass_support_only_0087d.py'
      - 'scripts/audit_coherent_mass_support_only_0087d_r1.py'
      - 'scripts/audit_coherent_mass_support_only_0087d_r2.py'
      - 'tests/test_audit_coherent_mass_support_only_0087d.py'
      - 'tests/test_audit_coherent_mass_support_only_0087d_r2.py'
      - '.github/workflows/0087d-r2-coherent-mass-support-only.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser/runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install pymupdf pytest
      - name: Run frozen 0087d plus r2 semantic-conformance tests
        run: pytest -q tests/test_audit_coherent_mass_support_only_0087d.py tests/test_audit_coherent_mass_support_only_0087d_r2.py
      - name: Execute unchanged 0087d scientific contract via r2 wrapper
        env:
          PYTHONPATH: scripts
        run: python scripts/audit_coherent_mass_support_only_0087d_r2.py
      - name: Upload exact 0087d-r2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0087d-r2-coherent-mass-support-only
          path: coherent_mass_support_only_0087d_r2.json
          if-no-files-found: error
