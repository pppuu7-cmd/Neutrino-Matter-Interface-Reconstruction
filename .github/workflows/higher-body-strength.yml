name: NMIR higher-body absolute-strength stress gate

on:
  push:
    paths:
      - 'research/higher_body_absolute_strength_prereg.md'
      - 'src/nmir/higher_body_strength.py'
      - 'tests/test_higher_body_strength.py'
      - 'scripts/higher_body_strength_benchmark.py'
      - '.github/workflows/higher-body-strength.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_higher_body_strength.py
      - run: mkdir -p artifacts/higher_body_strength
      - name: Run fail-closed frozen benchmark
        shell: bash
        run: |
          set -o pipefail
          python scripts/higher_body_strength_benchmark.py | tee artifacts/higher_body_strength/result.json
          grep -q 'PASS_EMPIRICAL_STRENGTH_STRONG_NEGATIVE' artifacts/higher_body_strength/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: higher-body-strength-result
          path: artifacts/higher_body_strength/result.json
