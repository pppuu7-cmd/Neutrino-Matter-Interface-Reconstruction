name: NMIR v2 0105a6 COHERENT SM-null semantics Stage-A

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6_coherent_sm_null_semantics_authority_inventory.md'
      - 'scripts/audit_0105a6_coherent_sm_null_semantics_stage_a.py'
      - 'tests/test_0105a6_coherent_sm_null_semantics_stage_a.py'
      - '.github/workflows/nmir_v2_0105a6_coherent_sm_null_semantics_stage_a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check pytest pypdf
      - name: Run dedicated guards
        run: python -m pytest -q tests/test_0105a6_coherent_sm_null_semantics_stage_a.py
      - name: Execute frozen Stage-A authority inventory
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6
          python scripts/audit_0105a6_coherent_sm_null_semantics_stage_a.py \
            --output artifacts/0105a6/authority_inventory.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6/run_stdout.txt
          sha256sum artifacts/0105a6/authority_inventory.json | tee artifacts/0105a6/authority_inventory_sha256.txt
      - name: Upload raw Stage-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6-coherent-sm-null-semantics-stage-a
          path: |
            artifacts/0105a6/authority_inventory.json
            artifacts/0105a6/authority_inventory_sha256.txt
            artifacts/0105a6/run_stdout.txt
          if-no-files-found: warn
