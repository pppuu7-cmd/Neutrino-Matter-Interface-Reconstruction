name: NMIR v2 0105a6e COHERENT ORNL example-code authority

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6e_coherent_ornl_example_code_authority.md'
      - 'scripts/audit_0105a6e_coherent_ornl_example_code_authority.py'
      - 'tests/test_0105a6e_coherent_ornl_example_code_authority.py'
      - '.github/workflows/nmir_v2_0105a6e_coherent_ornl_example_code_authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout NMIR
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gate-specific test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run deterministic guards
        run: python -m pytest -q tests/test_0105a6e_coherent_ornl_example_code_authority.py
      - name: Acquire exact official ORNL repository evidence
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6e
          python scripts/audit_0105a6e_coherent_ornl_example_code_authority.py \
            --output artifacts/0105a6e/ornl_authority_inventory.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6e/run_stdout.txt
          sha256sum artifacts/0105a6e/ornl_authority_inventory.json \
            | tee artifacts/0105a6e/inventory_sha256.txt
      - name: Upload raw authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6e-coherent-ornl-authority
          path: |
            artifacts/0105a6e/ornl_authority_inventory.json
            artifacts/0105a6e/inventory_sha256.txt
            artifacts/0105a6e/run_stdout.txt
