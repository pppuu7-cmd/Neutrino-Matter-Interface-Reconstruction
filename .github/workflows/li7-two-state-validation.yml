name: NMIR Li-7 two-state validation

on:
  push:
    paths:
      - 'src/nmir/li7_full_response.py'
      - 'tests/test_li7_full_response.py'
      - 'scripts/li7_two_state_validation.py'
      - '.github/workflows/li7-two-state-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Regression tests
        run: python -m pytest tests/test_li7_full_response.py -q
      - name: Run prospective validation
        run: python scripts/li7_two_state_validation.py
      - name: Upload raw scientific result
        uses: actions/upload-artifact@v4
        with:
          name: li7-two-state-validation
          path: artifacts/li7_two_state_validation.json
          if-no-files-found: error
