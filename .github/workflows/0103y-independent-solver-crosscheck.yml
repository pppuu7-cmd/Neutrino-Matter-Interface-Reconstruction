name: 0103Y independent solver crosscheck

on:
  push:
    paths:
      - '.github/workflows/0103y-independent-solver-crosscheck.yml'
      - 'research/prereg/0103yz_independent_solver_and_rephasing_prereg.md'
      - 'scripts/audit_0103y_independent_solver_crosscheck.py'
      - 'tests/test_audit_0103y_independent_solver_crosscheck.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-solver-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Focused independent solver test
        run: pytest -q tests/test_audit_0103y_independent_solver_crosscheck.py
      - name: Emit evidence
        run: python scripts/audit_0103y_independent_solver_crosscheck.py | tee 0103y_metrics.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0103y-independent-solver-crosscheck
          path: 0103y_metrics.json
          if-no-files-found: warn
