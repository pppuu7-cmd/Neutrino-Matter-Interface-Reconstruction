name: NMIR v2 0105a6q4e Ar 2022 review authority-bound count-law locator

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6q4e_argon_2022_review_authority_bound_count_law_locator_preregistration.md'
      - 'scripts/audit_0105a6q4e_argon_2022_review_authority_bound_count_law_locator.py'
      - 'tests/test_0105a6q4e_argon_2022_review_authority_bound_count_law_locator.py'
      - '.github/workflows/nmir_v2_0105a6q4e_argon_2022_review_authority_bound_count_law_locator.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  authority-bound-locator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Ensure pdftotext is available
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdftotext -v
      - name: Run frozen q4e guards
        run: python -m pytest -q tests/test_0105a6q4e_argon_2022_review_authority_bound_count_law_locator.py
      - name: Recover exact q4d parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/0105a6q4e/input/q4d
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10174763404/zip \
            > artifacts/0105a6q4e/input/q4d.zip
          echo 'e62f20e5d2d770599dc203419848300d2f433ef7715162603d812ea39039660d  artifacts/0105a6q4e/input/q4d.zip' | sha256sum -c -
          unzip -q artifacts/0105a6q4e/input/q4d.zip -d artifacts/0105a6q4e/input/q4d
          echo 'fd36f42625747fd849a1aa44acca61804dac84844f172f1eb4c5d91bb131e848  artifacts/0105a6q4e/input/q4d/result.json' | sha256sum -c -
      - name: Execute frozen authority-bound locator
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/audit_0105a6q4e_argon_2022_review_authority_bound_count_law_locator.py \
            --parent-q4d-result artifacts/0105a6q4e/input/q4d/result.json \
            --q4c-script scripts/audit_0105a6q4c_argon_2022_review_count_law_locator.py \
            --presentation artifacts/0105a6q4e/input/target.pdf \
            --output artifacts/0105a6q4e/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6q4e/stdout.txt
          sha256sum artifacts/0105a6q4e/result.json | tee artifacts/0105a6q4e/result_sha256.txt
      - name: Remove recovered/downloaded inputs before upload
        if: always()
        run: rm -rf artifacts/0105a6q4e/input
      - name: Upload q4e structured result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q4e-argon-2022-review-authority-bound-count-law-locator
          path: |
            artifacts/0105a6q4e/result.json
            artifacts/0105a6q4e/result_sha256.txt
            artifacts/0105a6q4e/stdout.txt
          if-no-files-found: warn
