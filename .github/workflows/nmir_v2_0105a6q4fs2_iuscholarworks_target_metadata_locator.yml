name: NMIR v2 0105a6q4fs2 IUScholarWorks target metadata locator

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - '.github/workflows/nmir_v2_0105a6q4fs2_iuscholarworks_target_metadata_locator.yml'
      - 'scripts/audit_0105a6q4fs2_iuscholarworks_target_metadata_locator.py'
      - 'tests/test_0105a6q4fs2_iuscholarworks_target_metadata_locator.py'
      - 'research/prereg/0105a6q4fs2_iuscholarworks_target_metadata_locator_preregistration.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-metadata-locator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run q4fs2 guards
        run: python -m pytest -q tests/test_0105a6q4fs2_iuscholarworks_target_metadata_locator.py
      - name: Execute frozen metadata-only target locator
        run: |
          mkdir -p artifacts/0105a6q4fs2
          python scripts/audit_0105a6q4fs2_iuscholarworks_target_metadata_locator.py --output artifacts/0105a6q4fs2/result.json --git-sha "$GITHUB_SHA"
          sha256sum artifacts/0105a6q4fs2/result.json > artifacts/0105a6q4fs2/result_sha256.txt
      - name: Verify prohibitions
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a6q4fs2/result.json'))
          assert d['request_count']==1
          assert d['item_links_followed'] is False
          assert d['identifier_guessed_or_constructed'] is False
          assert d['file_or_bitstream_downloaded'] is False
          assert d['dissertation_scientific_text_inspected'] is False
          assert d['likelihood_evaluated'] is False
          assert d['pseudo_data_generated'] is False
          assert d['systematic_monte_carlo_executed'] is False
          assert d['observed_bsm_residual_inspected'] is False
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          assert d['observed_bsm_residual_permission_percent']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q4fs2-iuscholarworks-target-metadata-locator
          path: artifacts/0105a6q4fs2/
          if-no-files-found: error
          retention-days: 90
