name: NMIR 0089a-r1 G9 frozen-map root certification PyPy replica

on:
  push:
    paths:
      - 'research/amendments/0089a_runtime_replica_pypy_conformance.md'
      - '.github/workflows/0089a-r1-g9-frozen-map-root-certification-pypy.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 'pypy3.10'
      - name: Install exact audit dependencies
        run: python -m pip install --upgrade pip && python -m pip install pytest
      - name: Run dedicated 0089a regression tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_g9_frozen_map_root_cert_0089a.py
      - name: Execute unchanged frozen 0089a root-certification audit
        env:
          PYTHONPATH: src
        run: python scripts/g9_frozen_map_root_cert_0089a.py
      - name: Upload exact 0089a PyPy replica artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-g9-0089a-root-certification-pypy-replica
          path: g9_0089a_result.json
          if-no-files-found: error
