name: NMIR v2 0105a6c COHERENT primary publication semantics

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6c_coherent_primary_publication_semantic_inventory.md'
      - 'scripts/audit_0105a6c_coherent_primary_publication_semantics.py'
      - 'tests/test_0105a6c_coherent_primary_publication_semantics.py'
      - '.github/workflows/nmir_v2_0105a6c_coherent_primary_publication_semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gate-specific dependencies
        run: python -m pip install --disable-pip-version-check pytest pypdf
      - name: Run dedicated guards
        run: python -m pytest -q tests/test_0105a6c_coherent_primary_publication_semantics.py
      - name: Inventory frozen primary-publication semantics
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6c
          python scripts/audit_0105a6c_coherent_primary_publication_semantics.py \
            --output artifacts/0105a6c/primary_publication_semantic_inventory.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6c/run_stdout.txt
          sha256sum artifacts/0105a6c/primary_publication_semantic_inventory.json \
            | tee artifacts/0105a6c/inventory_sha256.txt
      - name: Upload inventory only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6c-coherent-primary-publication-semantic-inventory
          path: |
            artifacts/0105a6c/primary_publication_semantic_inventory.json
            artifacts/0105a6c/inventory_sha256.txt
            artifacts/0105a6c/run_stdout.txt
          if-no-files-found: warn
