name: 0103 NuFIT 6.1 PMNS integration

on:
  push:
    paths:
      - '.github/workflows/0103-nufit61-pmns-integration.yml'
      - 'research/authority/0103_nufit61_three_flavor_manifest.json'
      - 'research/prereg/0103_nufit61_pmns_integration.md'
      - 'scripts/audit_0103_nufit61_pmns_integration.py'
      - 'tests/test_audit_0103_nufit61_pmns_integration.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Run machine-readable audit
        run: python scripts/audit_0103_nufit61_pmns_integration.py | tee 0103_nufit61_pmns_integration.json
      - name: Run focused pytest
        run: python -m pytest -q tests/test_audit_0103_nufit61_pmns_integration.py
      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0103-nufit61-pmns-integration
          path: 0103_nufit61_pmns_integration.json
          if-no-files-found: error
