name: NMIR 0081a authoritative B-L BBN vector gate

on:
  push:
    paths:
      - 'scripts/audit_esseili_kribs_bbn_vector_0081a_authority.py'
      - 'tests/test_audit_esseili_kribs_bbn_vector_0081a_authority.py'
      - 'research/prereg/0081a_bl_bbn_vector_calibration_semantic_identity.md'
      - 'research/prereg/0081a_implementation_freeze_authority.md'
      - '.github/workflows/0081a-authoritative-bl-bbn-vector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pytest PyMuPDF
      - name: Run dedicated tests
        run: python -m pytest -q tests/test_audit_esseili_kribs_bbn_vector_0081a_authority.py
      - name: Run authoritative frozen 0081a audit
        run: python scripts/audit_esseili_kribs_bbn_vector_0081a_authority.py
      - name: Hash result
        if: always()
        run: |
          if [ -f esseili_kribs_bbn_vector_0081a_authority.json ]; then sha256sum esseili_kribs_bbn_vector_0081a_authority.json; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0081a-authoritative-bl-bbn-vector
          path: esseili_kribs_bbn_vector_0081a_authority.json
          if-no-files-found: error
