name: NMIR 0083 Hong B-L source-text analytical authority
on:
  push:
    branches: [main]
    paths:
      - 'research/prereg/0083_hong_bl_source_text_analytical_authority.md'
      - 'scripts/audit_hong_bl_source_text_0083.py'
      - 'tests/test_audit_hong_bl_source_text_0083.py'
      - '.github/workflows/0083-hong-bl-source-text.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pytest
      - name: Run dedicated tests
        run: python -m pytest -q tests/test_audit_hong_bl_source_text_0083.py
      - name: Run frozen 0083 audit
        id: audit
        continue-on-error: true
        run: python scripts/audit_hong_bl_source_text_0083.py
      - name: Hash result
        if: always()
        run: if [ -f hong_bl_source_text_0083.json ]; then sha256sum hong_bl_source_text_0083.json; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0083-hong-bl-source-text
          path: hong_bl_source_text_0083.json
          if-no-files-found: error
      - name: Enforce anchor materialization
        if: always()
        run: test "${{ steps.audit.outcome }}" = "success"
