name: NMIR v2 0105a6k Zettlemoyer thesis Analysis-A scope map

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6k_zettlemoyer_thesis_analysisA_scope_map_preregistration.md'
      - 'scripts/audit_0105a6k_zettlemoyer_thesis_analysisA_scope_map.py'
      - 'tests/test_0105a6k_zettlemoyer_thesis_analysisA_scope_map.py'
      - '.github/workflows/nmir_v2_0105a6k_zettlemoyer_thesis_scope_map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-scope-map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check pytest
      - name: Run deterministic scope-selection guards
        run: python -m pytest -q tests/test_0105a6k_zettlemoyer_thesis_analysisA_scope_map.py
      - name: Map exact byte-locked thesis scope
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6k
          PYTHONPATH=. python scripts/audit_0105a6k_zettlemoyer_thesis_analysisA_scope_map.py \
            --output artifacts/0105a6k/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6k/stdout.txt
          sha256sum artifacts/0105a6k/result.json | tee artifacts/0105a6k/result_sha256.txt
      - name: Upload scope-map evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6k-zettlemoyer-analysisA-scope-map
          path: artifacts/0105a6k/
          if-no-files-found: warn
