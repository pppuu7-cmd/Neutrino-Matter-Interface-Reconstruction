name: NMIR v2 0105a6q4fr Suh 2025 institutional manifest transport repair

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6q4fr_suh_2025_institutional_manifest_transport_repair_preregistration.md'
      - 'scripts/audit_0105a6q4fr_suh_2025_institutional_manifest_transport_repair.py'
      - 'tests/test_0105a6q4fr_suh_2025_institutional_manifest_transport_repair.py'
      - '.github/workflows/nmir_v2_0105a6q4fr_suh_2025_institutional_manifest_transport_repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  institutional-manifest-transport-repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run q4fr guards
        run: python -m pytest -q tests/test_0105a6q4fr_suh_2025_institutional_manifest_transport_repair.py
      - name: Probe frozen official-IU metadata endpoints only
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6q4fr
          python scripts/audit_0105a6q4fr_suh_2025_institutional_manifest_transport_repair.py \
            --output artifacts/0105a6q4fr/result.json \
            --git-sha "$GITHUB_SHA" | tee artifacts/0105a6q4fr/stdout.txt
          sha256sum artifacts/0105a6q4fr/result.json | tee artifacts/0105a6q4fr/result_sha256.txt
      - name: Upload structured provenance result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q4fr-suh-2025-institutional-manifest-transport-repair
          path: |
            artifacts/0105a6q4fr/result.json
            artifacts/0105a6q4fr/result_sha256.txt
            artifacts/0105a6q4fr/stdout.txt
          if-no-files-found: warn
