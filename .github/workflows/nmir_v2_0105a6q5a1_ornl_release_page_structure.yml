name: NMIR v2 0105a6q5a1 ORNL release-page structure diagnostic
on:
  push:
    branches: [research/0105-bsm-residual-reconstruction]
    paths:
      - '.github/workflows/nmir_v2_0105a6q5a1_ornl_release_page_structure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frozen implementation
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run q5a1 guard tests
        run: python -m pytest -q tests/test_0105a6q5a1_ornl_release_page_structure.py
      - name: Run q5a1 structure diagnostic
        run: |
          mkdir -p artifacts/0105a6q5a1
          python scripts/audit_0105a6q5a1_ornl_release_page_structure.py --output artifacts/0105a6q5a1/result.json --git-sha "$GITHUB_SHA"
      - name: Verify hard guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a6q5a1/result.json'))
          assert d['linked_resources_followed'] is False
          assert d['scientific_release_content_inspected'] is False
          assert d['pseudo_data_generated'] is False
          assert d['likelihood_evaluated'] is False
          assert d['observed_bsm_residual_inspected'] is False
          assert d['systematic_monte_carlo_preregistration_permission_percent']==0
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          assert d['observed_bsm_residual_permission_percent']==0
          PY
      - name: Upload immutable result payload
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q5a1-ornl-release-page-structure
          path: artifacts/0105a6q5a1/result.json
          if-no-files-found: error
          retention-days: 90
