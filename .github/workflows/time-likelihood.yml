name: NMIR time-likelihood information bound gate

on:
  push:
    paths:
      - 'research/prereg/0057_time_likelihood_information_bound.md'
      - 'src/nmir/time_likelihood.py'
      - 'tests/test_time_likelihood.py'
      - 'scripts/time_likelihood_benchmark.py'
      - '.github/workflows/time-likelihood.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_time_likelihood.py
      - run: mkdir -p artifacts/time_likelihood
      - name: Run fail-closed frozen benchmark
        shell: bash
        run: |
          set -o pipefail
          python scripts/time_likelihood_benchmark.py | tee artifacts/time_likelihood/result.json
          grep -q 'PASS_TIME_LIKELIHOOD_BOUND' artifacts/time_likelihood/result.json
          grep -q 'TIME_SHAPE_USEFUL_BUT_INSUFFICIENT' artifacts/time_likelihood/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: time-likelihood-result
          path: artifacts/time_likelihood/result.json
