name: 0092b G9 Model-S composition authority

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/g9_ccsn_mev_composition_0092b.py'
      - 'scripts/g9_ccsn_mev_composition_0092b_r1.py'
      - 'research/prereg/0092b_g9_ccsn_mev_solar_transmission_authority.md'
      - 'research/amendments/0092b_a1_model_s_gong_composition_authority.md'
      - '.github/workflows/0092b-g9-model-s-composition.yml'

permissions:
  contents: read

jobs:
  model-s-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch frozen official Model-S authorities
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent 'NMIR-0092b-reproducibility/1.0' \
            'https://users-phys.au.dk/jcd/solar_models/cptrho.l5bi.d.15c' \
            --output cptrho.l5bi.d.15c
          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent 'NMIR-0092b-reproducibility/1.0' \
            'https://users-phys.au.dk/jcd/solar_models/fgong.l5bi.d.15c' \
            --output fgong.l5bi.d.15c
          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent 'NMIR-0092b-reproducibility/1.0' \
            'https://users-phys.au.dk/jcd/solar_models/file-format.pdf' \
            --output file-format.pdf
          sha256sum cptrho.l5bi.d.15c fgong.l5bi.d.15c file-format.pdf
          head -n 7 fgong.l5bi.d.15c
      - name: Execute frozen H-He-Z chord composition calculation r1
        run: |
          python scripts/g9_ccsn_mev_composition_0092b_r1.py \
            --density cptrho.l5bi.d.15c \
            --fgong fgong.l5bi.d.15c \
            --format-pdf file-format.pdf \
            --output g9_0092b_model_s_composition.json
      - name: Hash result
        if: always()
        run: sha256sum g9_0092b_model_s_composition.json || true
      - name: Upload authority artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-g9-0092b-model-s-composition-authority
          path: |
            g9_0092b_model_s_composition.json
            cptrho.l5bi.d.15c
            fgong.l5bi.d.15c
            file-format.pdf
          if-no-files-found: error
