name: 0103X six-state stress convergence audit

on:
  push:
    paths:
      - '.github/workflows/0103-six-state-stress-convergence.yml'
      - 'scripts/audit_0103_six_state_stress_convergence.py'
      - 'tests/test_audit_0103_six_state_stress_convergence.py'
      - 'research/prereg/0103_six_state_stress_convergence.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Run 0103X audit
        run: python scripts/audit_0103_six_state_stress_convergence.py | tee 0103X_stress_convergence.json
      - name: Run focused pytest
        run: python -m pytest -q tests/test_audit_0103_six_state_stress_convergence.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0103X-six-state-stress-convergence
          path: 0103X_stress_convergence.json
          if-no-files-found: error
