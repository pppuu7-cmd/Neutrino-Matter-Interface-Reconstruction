name: NMIR detector background requirement gate

on:
  push:
    paths:
      - 'research/detector_background_requirement_prereg.md'
      - 'src/nmir/background_requirements.py'
      - 'tests/test_background_requirements.py'
      - 'scripts/background_requirements_benchmark.py'
      - '.github/workflows/background-requirements.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_background_requirements.py
      - run: mkdir -p artifacts/background_requirements
      - name: Run fail-closed frozen benchmark
        shell: bash
        run: |
          set -o pipefail
          python scripts/background_requirements_benchmark.py | tee artifacts/background_requirements/result.json
          grep -q 'PASS_BACKGROUND_REQUIREMENT_MAP' artifacts/background_requirements/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: background-requirements-result
          path: artifacts/background_requirements/result.json
