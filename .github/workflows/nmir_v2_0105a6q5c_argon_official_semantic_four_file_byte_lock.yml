name: NMIR v2 0105a6q5c Argon official four-file byte lock
on:
  push:
    branches: [research/0105-bsm-residual-reconstruction]
    paths: ['.github/workflows/nmir_v2_0105a6q5c_argon_official_semantic_four_file_byte_lock.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  byte-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run dedicated guards
        run: python -m pytest -q tests/test_0105a6q5c_argon_official_semantic_four_file_byte_lock.py
      - name: Execute frozen q5c byte lock
        run: |
          mkdir -p artifacts/0105a6q5c
          python scripts/audit_0105a6q5c_argon_official_semantic_four_file_byte_lock.py --output artifacts/0105a6q5c/result.json --git-sha "$GITHUB_SHA"
      - name: Verify hard guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a6q5c/result.json'))
          for k in ['scientific_content_inspected','pseudo_data_generated','likelihood_evaluated','observed_bsm_residual_inspected']:
              assert d[k] is False
          assert d['systematic_monte_carlo_preregistration_permission_percent']==0
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          assert d['observed_bsm_residual_permission_percent']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q5c-argon-official-four-semantic-files-byte-lock
          path: artifacts/0105a6q5c/result.json
          if-no-files-found: error
          retention-days: 90
