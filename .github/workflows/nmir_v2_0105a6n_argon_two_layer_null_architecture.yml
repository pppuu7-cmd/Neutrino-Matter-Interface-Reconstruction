name: NMIR v2 0105a6n Ar two-layer null architecture

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6n_argon_two_layer_release_consistent_null_architecture_preregistration.md'
      - 'scripts/evaluate_0105a6n_argon_two_layer_null_architecture.py'
      - 'tests/test_0105a6n_argon_two_layer_null_architecture.py'
      - '.github/workflows/nmir_v2_0105a6n_argon_two_layer_null_architecture.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  architecture-adjudication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run frozen fail-closed architecture guards
        run: python -m pytest -q tests/test_0105a6n_argon_two_layer_null_architecture.py
      - name: Evaluate preregistered architecture only
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6n
          PYTHONPATH=. python scripts/evaluate_0105a6n_argon_two_layer_null_architecture.py \
            --output artifacts/0105a6n/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6n/stdout.txt
          sha256sum artifacts/0105a6n/result.json | tee artifacts/0105a6n/result_sha256.txt
      - name: Upload architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6n-argon-two-layer-null-architecture
          path: |
            artifacts/0105a6n/result.json
            artifacts/0105a6n/result_sha256.txt
            artifacts/0105a6n/stdout.txt
          if-no-files-found: warn
