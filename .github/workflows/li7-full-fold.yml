name: NMIR Li-7 validated full fold

on:
  push:
    paths:
      - 'src/nmir/li7_full_solar_fold.py'
      - 'scripts/li7_full_fold_benchmark.py'
      - '.github/workflows/li7-full-fold.yml'
  workflow_dispatch:

jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run validated Li-7 B16+MSW fold
        run: python scripts/li7_full_fold_benchmark.py
      - name: Upload raw scientific result
        uses: actions/upload-artifact@v4
        with:
          name: li7-full-fold
          path: artifacts/li7_full_fold/results.json
          if-no-files-found: error
