name: NMIR v2 0105a5b R1m3 CSMS to B4RITM authority mapping

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - '.github/workflows/nmir_v2_0105a5b_r1m3_csms_b4ritm_mapping.yml'
      - 'scripts/audit_0105a5b_r1m3_csms_b4ritm_mapping.py'
      - 'tests/test_0105a5b_r1m3_csms_b4ritm_mapping.py'
      - 'research/prereg_0105a5b_r1m3_amendment_01_fail_closed_hosted_classifier.md'
  workflow_dispatch:

jobs:
  csms-b4ritm-authority-mapping:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run R1m3 guards
        run: python -m pytest -q tests/test_0105a5b_r1m3_csms_b4ritm_mapping.py
      - name: Inspect prospectively frozen repository authority corpus
        run: python scripts/audit_0105a5b_r1m3_csms_b4ritm_mapping.py --output artifacts/0105a5b_r1m3/result.json --git-sha "$GITHUB_SHA"
      - name: Verify fail-closed evidence-only classification and hard prohibitions
        run: |
          python - <<'PY'
          import json
          p='artifacts/0105a5b_r1m3/result.json'
          d=json.load(open(p))
          assert d['classification']=='EVIDENCE_BUNDLE_ONLY_0105A5B_R1M3_UNCLASSIFIED'
          assert d['scientific_mapping_complete_machine_claim'] is False
          assert d['standard_3nu_executed'] is False
          assert d['systematic_monte_carlo_executed'] is False
          assert d['observed_bsm_residual_inspected'] is False
          assert d['network_requests_executed'] is False
          assert d['observed_bsm_residual_permission_percent']==0
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          PY
      - name: Hash result
        run: sha256sum artifacts/0105a5b_r1m3/result.json | tee artifacts/0105a5b_r1m3/result_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a5b-r1m3-csms-b4ritm-authority-mapping
          path: artifacts/0105a5b_r1m3/
          if-no-files-found: error
