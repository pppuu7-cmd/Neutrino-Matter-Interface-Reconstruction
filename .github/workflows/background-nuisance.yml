name: NMIR detector background nuisance requirement gate

on:
  push:
    paths:
      - 'research/prereg/0051_detector_background_nuisance_requirement.md'
      - 'src/nmir/background_nuisance.py'
      - 'tests/test_background_nuisance.py'
      - 'scripts/background_nuisance_benchmark.py'
      - '.github/workflows/background-nuisance.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_background_nuisance.py
      - run: mkdir -p artifacts/background_nuisance
      - name: Run fail-closed frozen benchmark
        shell: bash
        run: |
          set -o pipefail
          python scripts/background_nuisance_benchmark.py | tee artifacts/background_nuisance/result.json
          grep -q 'PASS_BACKGROUND_NUISANCE_REQUIREMENT_MAP' artifacts/background_nuisance/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: background-nuisance-result
          path: artifacts/background_nuisance/result.json
