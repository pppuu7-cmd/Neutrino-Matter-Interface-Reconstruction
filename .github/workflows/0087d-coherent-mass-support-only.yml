name: NMIR 0087d COHERENT B-L mass-support-only authority

on:
  push:
    paths:
      - 'research/prereg/0087d_coherent_mass_support_only_authority.md'
      - 'scripts/audit_coherent_mass_support_only_0087d.py'
      - 'tests/test_audit_coherent_mass_support_only_0087d.py'
      - '.github/workflows/0087d-coherent-mass-support-only.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser/runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install pymupdf pytest
      - name: Run prospective 0087d regression tests
        run: pytest -q tests/test_audit_coherent_mass_support_only_0087d.py
      - name: Execute frozen 0087d source audit
        env:
          PYTHONPATH: scripts
        run: python scripts/audit_coherent_mass_support_only_0087d.py
      - name: Upload exact 0087d artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0087d-coherent-mass-support-only
          path: coherent_mass_support_only_0087d.json
          if-no-files-found: error
