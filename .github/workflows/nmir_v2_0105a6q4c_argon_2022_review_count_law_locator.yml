name: NMIR v2 0105a6q4c Ar 2022 review count-law locator

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6q4c_argon_2022_collaboration_author_review_count_law_locator_preregistration.md'
      - 'scripts/audit_0105a6q4c_argon_2022_review_count_law_locator.py'
      - 'tests/test_0105a6q4c_argon_2022_review_count_law_locator.py'
      - '.github/workflows/nmir_v2_0105a6q4c_argon_2022_review_count_law_locator.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  presentation-locator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check pytest
      - name: Run frozen q4c guards
        run: python -m pytest -q tests/test_0105a6q4c_argon_2022_review_count_law_locator.py
      - name: Recover exact q4b parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/0105a6q4c/input/q4b
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10172447344/zip \
            > artifacts/0105a6q4c/input/q4b.zip
          echo '0b2b857f7bd5be70103bd8c8c711081fe0bacef1dae2e308fa037cff81f7a890  artifacts/0105a6q4c/input/q4b.zip' | sha256sum -c -
          unzip -q artifacts/0105a6q4c/input/q4b.zip -d artifacts/0105a6q4c/input/q4b
          echo '6fde625abdd97db2576004183cc3dae4a029b1a8da6ecf02bb89b65e58185059  artifacts/0105a6q4c/input/q4b/result.json' | sha256sum -c -
      - name: Execute frozen 2022 review locator
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/audit_0105a6q4c_argon_2022_review_count_law_locator.py \
            --parent-q4b-result artifacts/0105a6q4c/input/q4b/result.json \
            --presentation artifacts/0105a6q4c/input/JCZBLV2022_CEvNSReviewTalk.pdf \
            --output artifacts/0105a6q4c/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6q4c/stdout.txt
          sha256sum artifacts/0105a6q4c/result.json | tee artifacts/0105a6q4c/result_sha256.txt
      - name: Remove source inputs before upload
        if: always()
        run: rm -rf artifacts/0105a6q4c/input
      - name: Upload q4c result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q4c-argon-2022-review-count-law-locator
          path: |
            artifacts/0105a6q4c/result.json
            artifacts/0105a6q4c/result_sha256.txt
            artifacts/0105a6q4c/stdout.txt
          if-no-files-found: warn
