name: NMIR v2 0105a6p Ar exact-byte reconstruction transport

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6p_argon_content_addressed_exact_byte_reconstruction_preregistration.md'
      - 'scripts/audit_0105a6p_argon_exact_byte_reconstruction.py'
      - 'tests/test_0105a6p_argon_exact_byte_reconstruction.py'
      - '.github/workflows/nmir_v2_0105a6p_argon_exact_byte_reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-byte-reconstruction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run exact-byte reconstruction guards
        run: python -m pytest -q tests/test_0105a6p_argon_exact_byte_reconstruction.py
      - name: Reconstruct and verify exact official bytes
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6p
          PYTHONPATH=. python scripts/audit_0105a6p_argon_exact_byte_reconstruction.py \
            --output-dir artifacts/0105a6p \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6p/stdout.txt
          sha256sum artifacts/0105a6p/manifest.json | tee artifacts/0105a6p/manifest_sha256.txt
      - name: Upload reconstructed exact bytes and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6p-argon-exact-official-byte-reconstruction
          path: artifacts/0105a6p/
          if-no-files-found: warn
