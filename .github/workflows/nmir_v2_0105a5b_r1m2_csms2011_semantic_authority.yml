name: NMIR v2 0105a5b R1m2 CSMS 2011 semantic authority

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - '.github/workflows/nmir_v2_0105a5b_r1m2_csms2011_semantic_authority.yml'
  workflow_dispatch:

jobs:
  csms2011-semantic-authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run R1m2 guards
        run: python -m pytest -q tests/test_0105a5b_r1m2_csms2011_semantic_authority.py
      - name: Inspect frozen CSMS source candidate only
        run: python scripts/audit_0105a5b_r1m2_csms2011_semantic_authority.py --output artifacts/0105a5b_r1m2/result.json --git-sha "$GITHUB_SHA"
      - name: Verify hard prohibitions
        run: |
          python - <<'PY'
          import json
          p='artifacts/0105a5b_r1m2/result.json'
          d=json.load(open(p))
          assert d['standard_3nu_executed'] is False
          assert d['systematic_monte_carlo_executed'] is False
          assert d['observed_bsm_residual_inspected'] is False
          assert d['observed_bsm_residual_permission_percent']==0
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          assert d['classification']!='INFRASTRUCTURE_FAIL_0105A5B_R1M2'
          PY
      - name: Hash result
        run: sha256sum artifacts/0105a5b_r1m2/result.json | tee artifacts/0105a5b_r1m2/result_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a5b-r1m2-csms2011-semantic-authority
          path: artifacts/0105a5b_r1m2/
          if-no-files-found: error
