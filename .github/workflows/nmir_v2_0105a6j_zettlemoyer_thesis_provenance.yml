name: NMIR v2 0105a6j Zettlemoyer thesis provenance byte lock

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6j_zettlemoyer_thesis_provenance_byte_lock_preregistration.md'
      - 'scripts/audit_0105a6j_zettlemoyer_thesis_provenance_byte_lock.py'
      - 'tests/test_0105a6j_zettlemoyer_thesis_provenance_byte_lock.py'
      - '.github/workflows/nmir_v2_0105a6j_zettlemoyer_thesis_provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-byte-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run fail-closed provenance guards
        run: python -m pytest -q tests/test_0105a6j_zettlemoyer_thesis_provenance_byte_lock.py
      - name: Acquire institutional source and classify provenance
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6j
          PYTHONPATH=. python scripts/audit_0105a6j_zettlemoyer_thesis_provenance_byte_lock.py \
            --output artifacts/0105a6j/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6j/stdout.txt
          sha256sum artifacts/0105a6j/result.json | tee artifacts/0105a6j/result_sha256.txt
      - name: Upload provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6j-zettlemoyer-thesis-provenance
          path: artifacts/0105a6j/
          if-no-files-found: warn
