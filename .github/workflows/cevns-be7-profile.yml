name: CEvNS Be7 physical-profile gate

on:
  push:
    paths:
      - 'data/be7_bahcall1994_ground_profile.csv'
      - 'src/nmir/cevns_be7_profile.py'
      - 'tests/test_cevns_be7_profile.py'
      - 'scripts/cevns_be7_profile_benchmark.py'
      - 'research/cevns_be7_profile_prereg.md'
      - '.github/workflows/cevns-be7-profile.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run dedicated tests
        run: PYTHONPATH=src python -m pytest -q tests/test_cevns_be7_profile.py
      - name: Run physical-profile benchmark
        run: PYTHONPATH=src python scripts/cevns_be7_profile_benchmark.py | tee cevns-be7-profile.json
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: cevns-be7-profile-result
          path: cevns-be7-profile.json
