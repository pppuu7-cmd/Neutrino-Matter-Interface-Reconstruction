name: 0096 v2 G9 Betelgeuse central support

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/g9_betelgeuse_central_support_0096.py'
      - 'scripts/g9_betelgeuse_central_support_0096_aggregate.py'
      - 'research/prereg/0096_v2_g9_betelgeuse_central_support_certification.md'
      - '.github/workflows/0096-v2-g9-betelgeuse-central-support.yml'

permissions:
  contents: read

jobs:
  primary:
    strategy:
      fail-fast: false
      matrix:
        control: [0, 1, 2]
        receiver: [0, 1, 2]
        distance: [190, 222]
        radius: [21, 100]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy mpmath
      - name: Execute one frozen 4097-point 0096 family
        continue-on-error: true
        run: |
          PYTHONPATH=src:scripts python scripts/g9_betelgeuse_central_support_0096.py \
            --mode primary \
            --control ${{ matrix.control }} \
            --receiver ${{ matrix.receiver }} \
            --distance-pc ${{ matrix.distance }} \
            --radius-km ${{ matrix.radius }} \
            --output g9_0096_primary_${{ matrix.control }}_${{ matrix.receiver }}_${{ matrix.distance }}_${{ matrix.radius }}.json
      - name: Hash primary family shard
        if: always()
        run: sha256sum g9_0096_primary_${{ matrix.control }}_${{ matrix.receiver }}_${{ matrix.distance }}_${{ matrix.radius }}.json || true
      - name: Upload raw primary family shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-g9-0096-primary-${{ matrix.control }}-${{ matrix.receiver }}-${{ matrix.distance }}-${{ matrix.radius }}
          path: g9_0096_primary_${{ matrix.control }}_${{ matrix.receiver }}_${{ matrix.distance }}_${{ matrix.radius }}.json
          if-no-files-found: error

  primary-aggregate:
    if: always()
    needs: [primary]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: nmir-v2-g9-0096-primary-*
          path: primary-shards
          merge-multiple: true
      - name: Aggregate all 36 frozen primary families and select global minimum
        continue-on-error: true
        run: |
          python scripts/g9_betelgeuse_central_support_0096_aggregate.py \
            --mode primary --input primary-shards --output g9_0096_primary_summary.json
      - name: Hash primary summary
        if: always()
        run: sha256sum g9_0096_primary_summary.json || true
      - name: Upload primary summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-g9-0096-primary-summary
          path: g9_0096_primary_summary.json
          if-no-files-found: error

  sensitivity:
    if: always()
    needs: [primary-aggregate]
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy mpmath
      - uses: actions/download-artifact@v4
        with:
          name: nmir-v2-g9-0096-primary-summary
          path: primary-summary
      - name: Execute frozen 8193-point sensitivity family chunk
        continue-on-error: true
        run: |
          PYTHONPATH=src:scripts python scripts/g9_betelgeuse_central_support_0096.py \
            --mode sensitivity-chunk \
            --spec primary-summary/g9_0096_primary_summary.json \
            --chunk ${{ matrix.chunk }} \
            --output g9_0096_sensitivity_${{ matrix.chunk }}.json
      - name: Hash sensitivity chunk
        if: always()
        run: sha256sum g9_0096_sensitivity_${{ matrix.chunk }}.json || true
      - name: Upload sensitivity chunk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-g9-0096-sensitivity-${{ matrix.chunk }}
          path: g9_0096_sensitivity_${{ matrix.chunk }}.json
          if-no-files-found: error

  final:
    if: always()
    needs: [primary-aggregate, sensitivity]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nmir-v2-g9-0096-primary-summary
          path: primary-summary
      - uses: actions/download-artifact@v4
        with:
          pattern: nmir-v2-g9-0096-sensitivity-*
          path: sensitivity
          merge-multiple: true
      - name: Produce frozen terminal 0096 classification
        continue-on-error: true
        run: |
          python scripts/g9_betelgeuse_central_support_0096_aggregate.py \
            --mode final \
            --primary primary-summary/g9_0096_primary_summary.json \
            --sensitivity-dir sensitivity \
            --output g9_0096_result.json
      - name: Hash terminal result
        if: always()
        run: sha256sum g9_0096_result.json || true
      - name: Upload authoritative 0096 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-g9-0096-authoritative
          path: g9_0096_result.json
          if-no-files-found: error
      - name: Preserve infrastructure failure exit
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('g9_0096_result.json')
          if not p.exists(): raise SystemExit(1)
          s = json.loads(p.read_text())['status']
          print('0096 terminal status:', s)
          if s.startswith('INFRASTRUCTURE_FAIL_'): raise SystemExit(1)
          PY
