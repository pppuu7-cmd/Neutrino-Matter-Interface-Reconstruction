name: NMIR v2 0105a6q4 Ar presentation count-law locator

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6q4_argon_collaboration_author_presentation_count_law_locator_preregistration.md'
      - 'scripts/audit_0105a6q4_argon_presentation_count_law_locator.py'
      - 'tests/test_0105a6q4_argon_presentation_count_law_locator.py'
      - '.github/workflows/nmir_v2_0105a6q4_argon_presentation_count_law_locator.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  presentation-locator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check pytest
      - name: Run frozen q4 guards
        run: python -m pytest -q tests/test_0105a6q4_argon_presentation_count_law_locator.py
      - name: Recover exact q3 parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/0105a6q4/input/q3
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10168043662/zip \
            > artifacts/0105a6q4/input/q3.zip
          echo '832aaaa60ae49be083d4f848f36c0a38d2118a1785413ac562dbbc2edd132186  artifacts/0105a6q4/input/q3.zip' | sha256sum -c -
          unzip -q artifacts/0105a6q4/input/q3.zip -d artifacts/0105a6q4/input/q3
          echo '32f7d67f3f669a3809dd2b699c3a3f561f27d97d96010b0fd8f1beae7d190037  artifacts/0105a6q4/input/q3/result.json' | sha256sum -c -
      - name: Execute frozen presentation locator
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/audit_0105a6q4_argon_presentation_count_law_locator.py \
            --parent-q3-result artifacts/0105a6q4/input/q3/result.json \
            --presentation artifacts/0105a6q4/input/m7s2019_Zettlemoyer-Jacob.pdf \
            --output artifacts/0105a6q4/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6q4/stdout.txt
          sha256sum artifacts/0105a6q4/result.json | tee artifacts/0105a6q4/result_sha256.txt
      - name: Remove source inputs before upload
        if: always()
        run: rm -rf artifacts/0105a6q4/input
      - name: Upload q4 result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q4-argon-presentation-count-law-locator
          path: |
            artifacts/0105a6q4/result.json
            artifacts/0105a6q4/result_sha256.txt
            artifacts/0105a6q4/stdout.txt
          if-no-files-found: warn
