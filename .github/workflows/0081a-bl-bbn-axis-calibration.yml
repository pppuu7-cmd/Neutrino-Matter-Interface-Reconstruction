name: NMIR 0081a B-L BBN axis calibration

on:
  push:
    paths:
      - 'scripts/calibrate_esseili_kribs_bbn_axes_0081a.py'
      - 'tests/test_calibrate_esseili_kribs_bbn_axes_0081a.py'
      - 'research/prereg/0081a_bl_bbn_axis_calibration.md'
      - '.github/workflows/0081a-bl-bbn-axis-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pytest PyMuPDF
      - name: Run dedicated tests
        run: python -m pytest -q tests/test_calibrate_esseili_kribs_bbn_axes_0081a.py
      - name: Run frozen 0081a BBN calibration
        run: python scripts/calibrate_esseili_kribs_bbn_axes_0081a.py
      - name: Hash result
        if: always()
        run: |
          if [ -f esseili_kribs_bbn_axis_calibration_0081a.json ]; then sha256sum esseili_kribs_bbn_axis_calibration_0081a.json; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0081a-bl-bbn-axis-calibration
          path: esseili_kribs_bbn_axis_calibration_0081a.json
          if-no-files-found: error
