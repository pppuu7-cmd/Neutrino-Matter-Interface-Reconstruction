name: NMIR finite-horizon LEE mitigation budget gate

on:
  push:
    paths:
      - 'research/prereg/0056_finite_horizon_mitigation_budget.md'
      - 'src/nmir/finite_horizon_mitigation.py'
      - 'tests/test_finite_horizon_mitigation.py'
      - 'scripts/finite_horizon_mitigation_benchmark.py'
      - '.github/workflows/finite-horizon-mitigation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_finite_horizon_mitigation.py
      - run: mkdir -p artifacts/finite_horizon_mitigation
      - name: Run fail-closed frozen benchmark
        shell: bash
        run: |
          set -o pipefail
          python scripts/finite_horizon_mitigation_benchmark.py | tee artifacts/finite_horizon_mitigation/result.json
          grep -q 'PASS_FINITE_HORIZON_MITIGATION_BUDGET' artifacts/finite_horizon_mitigation/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: finite-horizon-mitigation-result
          path: artifacts/finite_horizon_mitigation/result.json
