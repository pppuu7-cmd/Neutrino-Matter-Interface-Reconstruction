name: NMIR v2 0105a6q Ar systematic excursion semantics preflight

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6q_argon_systematic_excursion_semantics_preflight_preregistration.md'
      - 'scripts/audit_0105a6q_argon_systematic_excursion_semantics_preflight_v2.py'
      - 'tests/test_0105a6q_argon_systematic_excursion_semantics_preflight.py'
      - '.github/workflows/nmir_v2_0105a6q_argon_systematic_excursion_semantics_preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  systematic-semantics-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check numpy pytest
      - name: Run frozen 0105a6q guards
        run: python -m pytest -q tests/test_0105a6q_argon_systematic_excursion_semantics_preflight.py
      - name: Recover exact 0105a6p official bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/0105a6q/input
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10160794369/zip \
            > artifacts/0105a6q/input/a6p.zip
          echo 'a66b3408b22b14575f156c0be7c389589dd9865ada1f4769fe8366a1df65ec82  artifacts/0105a6q/input/a6p.zip' | sha256sum -c -
          unzip -q artifacts/0105a6q/input/a6p.zip -d artifacts/0105a6q/input/a6p
          echo '5b1df47a50dd4dbb2a7fbd5ee64346c2854bdbad0540bfa6f16637eb10b6bada  artifacts/0105a6q/input/a6p/manifest.json' | sha256sum -c -
      - name: Recover exact 0105a6m bounded evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10160137826/zip \
            > artifacts/0105a6q/input/a6m.zip
          echo 'df11b8726e52b3b1662509d3130bfab39c45bd298e5d21995a0613a375fa7d6b  artifacts/0105a6q/input/a6m.zip' | sha256sum -c -
          mkdir -p artifacts/0105a6q/input/a6m
          unzip -q artifacts/0105a6q/input/a6m.zip -d artifacts/0105a6q/input/a6m
          echo '672b8e5ec68e01395250e97fbafcbda956f8ffc51b52773d6379588b1fb87364  artifacts/0105a6q/input/a6m/evidence.json' | sha256sum -c -
      - name: Execute prospectively frozen semantics preflight
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/audit_0105a6q_argon_systematic_excursion_semantics_preflight_v2.py \
            --files-dir artifacts/0105a6q/input/a6p/reconstructed_exact_official_bytes \
            --a6p-manifest artifacts/0105a6q/input/a6p/manifest.json \
            --a6m-evidence artifacts/0105a6q/input/a6m/evidence.json \
            --thesis artifacts/0105a6q/input/zettlemoyer_thesis.pdf \
            --output artifacts/0105a6q/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6q/stdout.txt
          sha256sum artifacts/0105a6q/result.json | tee artifacts/0105a6q/result_sha256.txt
      - name: Remove exact inputs before result upload
        if: always()
        run: rm -rf artifacts/0105a6q/input
      - name: Upload semantics result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q-argon-systematic-excursion-semantics-preflight
          path: |
            artifacts/0105a6q/result.json
            artifacts/0105a6q/result_sha256.txt
            artifacts/0105a6q/stdout.txt
          if-no-files-found: warn
