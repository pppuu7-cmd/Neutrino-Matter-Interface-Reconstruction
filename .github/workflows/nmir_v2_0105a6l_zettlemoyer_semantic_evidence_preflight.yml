name: NMIR v2 0105a6l Zettlemoyer Analysis-A semantic evidence preflight

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6l_zettlemoyer_analysisA_semantic_evidence_preflight_preregistration.md'
      - 'scripts/audit_0105a6l_zettlemoyer_analysisA_semantic_evidence_preflight.py'
      - 'tests/test_0105a6l_zettlemoyer_analysisA_semantic_evidence_preflight.py'
      - '.github/workflows/nmir_v2_0105a6l_zettlemoyer_semantic_evidence_preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-evidence-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check pytest
      - name: Run fail-closed semantic-evidence guards
        run: python -m pytest -q tests/test_0105a6l_zettlemoyer_analysisA_semantic_evidence_preflight.py
      - name: Execute frozen 30-page machine-text evidence preflight
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6l
          PYTHONPATH=. python scripts/audit_0105a6l_zettlemoyer_analysisA_semantic_evidence_preflight.py \
            --output artifacts/0105a6l/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6l/stdout.txt
          sha256sum artifacts/0105a6l/result.json | tee artifacts/0105a6l/result_sha256.txt
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6l-zettlemoyer-semantic-evidence-preflight
          path: artifacts/0105a6l/
          if-no-files-found: warn
