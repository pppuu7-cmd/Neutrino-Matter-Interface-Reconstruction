name: NMIR v2 0105a6q3 Ar pseudo-data count-law semantics

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6q3_argon_pseudodata_count_law_candidate_semantics_preregistration.md'
      - 'scripts/audit_0105a6q3_argon_pseudodata_count_law_candidate_semantics.py'
      - 'tests/test_0105a6q3_argon_pseudodata_count_law_candidate_semantics.py'
      - '.github/workflows/nmir_v2_0105a6q3_argon_pseudodata_count_law_candidate_semantics.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  semantic-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check pytest
      - name: Run frozen 0105a6q3 guards
        run: python -m pytest -q tests/test_0105a6q3_argon_pseudodata_count_law_candidate_semantics.py
      - name: Recover exact 0105a6q2 locator result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/0105a6q3/input/q2
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10167939898/zip \
            > artifacts/0105a6q3/input/q2.zip
          echo '0db4fd55a3a3a09110f7f60c2dd388b1d65089b04e549961806fbdd360a286a3  artifacts/0105a6q3/input/q2.zip' | sha256sum -c -
          unzip -q artifacts/0105a6q3/input/q2.zip -d artifacts/0105a6q3/input/q2
          echo 'c0d913c442130817b7b59e2a785784b40b85e3c501ce9309699a55b0e66e88f3  artifacts/0105a6q3/input/q2/result.json' | sha256sum -c -
      - name: Execute prospectively frozen candidate semantic audit
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/audit_0105a6q3_argon_pseudodata_count_law_candidate_semantics.py \
            --parent-q2-result artifacts/0105a6q3/input/q2/result.json \
            --thesis artifacts/0105a6q3/input/zettlemoyer_thesis.pdf \
            --output artifacts/0105a6q3/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6q3/stdout.txt
          sha256sum artifacts/0105a6q3/result.json | tee artifacts/0105a6q3/result_sha256.txt
      - name: Remove source inputs before result upload
        if: always()
        run: rm -rf artifacts/0105a6q3/input
      - name: Upload q3 result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q3-argon-pseudodata-count-law-semantics
          path: |
            artifacts/0105a6q3/result.json
            artifacts/0105a6q3/result_sha256.txt
            artifacts/0105a6q3/stdout.txt
          if-no-files-found: warn
