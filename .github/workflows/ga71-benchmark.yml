name: NMIR Ga71 benchmark

on:
  push:
    paths:
      - 'data/ga71_bahcall1997_response.csv'
      - 'src/nmir/ga71_response.py'
      - 'src/nmir/solar_spectra.py'
      - 'data/solar_spectrum_manifest.csv'
      - 'scripts/ga71_unoscillated_benchmark.py'
      - '.github/workflows/ga71-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run prospective Ga-71 source-average gate
        run: python scripts/ga71_unoscillated_benchmark.py
      - name: Upload exact benchmark payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga71-unoscillated-benchmark
          path: artifacts/ga71_benchmark/
          if-no-files-found: error
