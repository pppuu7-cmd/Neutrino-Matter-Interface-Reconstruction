name: NMIR v2 0105a6q4fl Suh 2025 institutional dissertation href locator

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6q4fl_suh_2025_institutional_dissertation_href_locator_preregistration.md'
      - 'scripts/audit_0105a6q4fl_suh_2025_institutional_dissertation_href_locator.py'
      - 'tests/test_0105a6q4fl_suh_2025_institutional_dissertation_href_locator.py'
      - '.github/workflows/nmir_v2_0105a6q4fl_suh_2025_institutional_dissertation_href_locator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  institutional-dissertation-href-locator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run q4fl guards
        run: python -m pytest -q tests/test_0105a6q4fl_suh_2025_institutional_dissertation_href_locator.py
      - name: Locate href candidates without following them
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6q4fl
          python scripts/audit_0105a6q4fl_suh_2025_institutional_dissertation_href_locator.py \
            --output artifacts/0105a6q4fl/result.json \
            --git-sha "$GITHUB_SHA" | tee artifacts/0105a6q4fl/stdout.txt
          sha256sum artifacts/0105a6q4fl/result.json | tee artifacts/0105a6q4fl/result_sha256.txt
      - name: Upload structured locator result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q4fl-suh-2025-institutional-dissertation-href-locator
          path: |
            artifacts/0105a6q4fl/result.json
            artifacts/0105a6q4fl/result_sha256.txt
            artifacts/0105a6q4fl/stdout.txt
          if-no-files-found: warn
