name: NMIR 0087a partial B-L topology relay validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/validate_partial_bl_topology_relay_0087a.py'
      - 'tests/test_partial_bl_topology_relay_0087a.py'
      - '.github/workflows/0087a-partial-bl-topology-relay-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact geometry/runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest shapely pymupdf
      - name: Run prospective validation regression tests
        env:
          PYTHONPATH: .:scripts
        run: python -m pytest -q tests/test_partial_bl_topology_relay_0087a.py
      - name: Execute frozen 0087a validation audit
        env:
          PYTHONPATH: .:scripts
        run: |
          mkdir -p artifacts/0087a
          cd artifacts/0087a
          python ../../scripts/validate_partial_bl_topology_relay_0087a.py
          sha256sum partial_bl_topology_relay_validation_0087a.json | tee RAW_JSON_SHA256.txt
      - name: Upload exact validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0087a-partial-bl-topology-relay-validation
          path: artifacts/0087a/
          if-no-files-found: error
