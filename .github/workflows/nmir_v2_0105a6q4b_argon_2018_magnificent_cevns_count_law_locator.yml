name: NMIR v2 0105a6q4b Ar 2018 Magnificent CEvNS count-law locator

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6q4b_argon_2018_magnificent_cevns_count_law_locator_preregistration.md'
      - 'scripts/audit_0105a6q4b_argon_2018_magnificent_cevns_count_law_locator.py'
      - 'tests/test_0105a6q4b_argon_2018_magnificent_cevns_count_law_locator.py'
      - '.github/workflows/nmir_v2_0105a6q4b_argon_2018_magnificent_cevns_count_law_locator.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  presentation-locator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check pytest
      - name: Run frozen q4b guards
        run: python -m pytest -q tests/test_0105a6q4b_argon_2018_magnificent_cevns_count_law_locator.py
      - name: Recover exact q4a parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/0105a6q4b/input/q4a
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10170007388/zip \
            > artifacts/0105a6q4b/input/q4a.zip
          echo '283a74b1c499c8c290d9c215e4cb44bcbc1d6f120910130a16adafc2aab51c4a  artifacts/0105a6q4b/input/q4a.zip' | sha256sum -c -
          unzip -q artifacts/0105a6q4b/input/q4a.zip -d artifacts/0105a6q4b/input/q4a
          echo 'f270cd8183003a2a328a5dc361858acf7a75074d0a205bd57305ab1ba259ab5c  artifacts/0105a6q4b/input/q4a/result.json' | sha256sum -c -
      - name: Execute frozen 2018 presentation locator
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/audit_0105a6q4b_argon_2018_magnificent_cevns_count_law_locator.py \
            --parent-q4a-result artifacts/0105a6q4b/input/q4a/result.json \
            --presentation artifacts/0105a6q4b/input/talk-zettlemoyer-jacob.pdf \
            --output artifacts/0105a6q4b/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6q4b/stdout.txt
          sha256sum artifacts/0105a6q4b/result.json | tee artifacts/0105a6q4b/result_sha256.txt
      - name: Remove source inputs before upload
        if: always()
        run: rm -rf artifacts/0105a6q4b/input
      - name: Upload q4b result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q4b-argon-2018-magnificent-cevns-count-law-locator
          path: |
            artifacts/0105a6q4b/result.json
            artifacts/0105a6q4b/result_sha256.txt
            artifacts/0105a6q4b/stdout.txt
          if-no-files-found: warn
