name: NMIR nonlinear homogeneous mediator gate

on:
  push:
    paths:
      - 'src/nmir/nonlinear_homogeneous_mediator.py'
      - 'tests/test_nonlinear_homogeneous_mediator.py'
      - 'scripts/nonlinear_homogeneous_mediator_benchmark.py'
      - 'research/nonlinear_homogeneous_mediator_prereg.md'
      - '.github/workflows/nonlinear-homogeneous-mediator.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - name: Run nonlinear homogeneous mediator tests
        run: pytest -q tests/test_nonlinear_homogeneous_mediator.py
      - name: Evaluate nonlinear homogeneous mediator benchmark
        run: |
          mkdir -p artifacts/nonlinear_homogeneous_mediator
          python scripts/nonlinear_homogeneous_mediator_benchmark.py | tee artifacts/nonlinear_homogeneous_mediator/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: nonlinear-homogeneous-mediator-result
          path: artifacts/nonlinear_homogeneous_mediator/result.json
