name: NMIR v2 0105a6h Ar content-addressed semantic recovery

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6h_argon_content_addressed_semantic_file_recovery.md'
      - 'scripts/audit_0105a6h_argon_content_addressed_semantic_file_recovery.py'
      - 'tests/test_0105a6h_argon_content_addressed_semantic_file_recovery.py'
      - '.github/workflows/nmir_v2_0105a6h_argon_content_addressed_semantic_file_recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  byte-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run deterministic guards
        run: python -m pytest -q tests/test_0105a6h_argon_content_addressed_semantic_file_recovery.py
      - name: Test raw byte equivalence against official 0105a3 identities
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6h
          python scripts/audit_0105a6h_argon_content_addressed_semantic_file_recovery.py \
            --output artifacts/0105a6h/result.json --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6h/stdout.txt
          sha256sum artifacts/0105a6h/result.json | tee artifacts/0105a6h/result_sha256.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6h-argon-content-addressed-semantic-recovery
          path: artifacts/0105a6h/
