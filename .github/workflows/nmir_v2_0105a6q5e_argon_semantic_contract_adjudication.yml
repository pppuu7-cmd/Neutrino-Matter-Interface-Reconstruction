name: NMIR v2 0105a6q5e Argon semantic contract adjudication
on:
  push:
    branches: [research/0105-bsm-residual-reconstruction]
    paths: ['.github/workflows/nmir_v2_0105a6q5e_argon_semantic_contract_adjudication.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  adjudication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run dedicated guards
        run: python -m pytest -q tests/test_0105a6q5e_argon_semantic_contract_adjudication.py
      - name: Acquire exact validated q5d artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/0105a6q5e
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10179973686/zip \
            -o artifacts/0105a6q5e/q5d.zip
      - name: Execute frozen q5e adjudication
        run: |
          python scripts/adjudicate_0105a6q5e_argon_semantic_contract.py \
            --q5d-zip artifacts/0105a6q5e/q5d.zip \
            --output artifacts/0105a6q5e/result.json \
            --git-sha "$GITHUB_SHA"
      - name: Verify hard guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a6q5e/result.json'))
          for k in ['pseudo_data_generated','likelihood_evaluated','fit_executed','nuisance_profiled','systematic_monte_carlo_executed','observed_bsm_residual_inspected']:
              assert d[k] is False
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          assert d['observed_bsm_residual_permission_percent']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q5e-argon-semantic-contract-adjudication
          path: artifacts/0105a6q5e/result.json
          if-no-files-found: error
          retention-days: 90
