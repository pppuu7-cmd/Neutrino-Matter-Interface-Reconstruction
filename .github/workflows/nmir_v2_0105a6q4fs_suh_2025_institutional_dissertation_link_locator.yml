name: NMIR v2 0105a6q4fs Suh 2025 institutional dissertation link locator
on:
  push:
    branches: [research/0105-bsm-residual-reconstruction]
    paths: ['.github/workflows/nmir_v2_0105a6q4fs_suh_2025_institutional_dissertation_link_locator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  institutional-dissertation-link-locator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run q4fs guards
        run: python -m pytest -q tests/test_0105a6q4fs_suh_2025_institutional_dissertation_link_locator.py
      - name: Execute frozen link locator only
        run: |
          mkdir -p artifacts/0105a6q4fs
          python scripts/audit_0105a6q4fs_suh_2025_institutional_dissertation_link_locator.py --output artifacts/0105a6q4fs/result.json --git-sha "$GITHUB_SHA"
          sha256sum artifacts/0105a6q4fs/result.json > artifacts/0105a6q4fs/result_sha256.txt
      - name: Verify prohibitions
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a6q4fs/result.json'))
          assert d['page_links_followed'] is False
          assert d['pdf_downloaded'] is False
          assert d['pdf_content_inspected'] is False
          assert d['likelihood_evaluated'] is False
          assert d['pseudo_data_generated'] is False
          assert d['systematic_monte_carlo_executed'] is False
          assert d['observed_bsm_residual_inspected'] is False
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          assert d['observed_bsm_residual_permission_percent']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q4fs-suh-2025-institutional-dissertation-link-locator
          path: artifacts/0105a6q4fs/
          if-no-files-found: error
          retention-days: 90
