name: NMIR v2 0105a6q5b Argon official semantic-file locator
on:
  push:
    branches: [research/0105-bsm-residual-reconstruction]
    paths: ['.github/workflows/nmir_v2_0105a6q5b_argon_official_release_semantic_file_locator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_0105a6q5b_argon_official_release_semantic_file_locator.py
      - run: |
          mkdir -p artifacts/0105a6q5b
          python scripts/audit_0105a6q5b_argon_official_release_semantic_file_locator.py --output artifacts/0105a6q5b/result.json --git-sha "$GITHUB_SHA"
      - name: Verify hard guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a6q5b/result.json'))
          for k in ['release_file_bytes_downloaded','scientific_release_content_inspected','pseudo_data_generated','likelihood_evaluated','observed_bsm_residual_inspected']: assert d[k] is False
          assert d['systematic_monte_carlo_preregistration_permission_percent']==0
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          assert d['observed_bsm_residual_permission_percent']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q5b-argon-official-semantic-file-locator
          path: artifacts/0105a6q5b/result.json
          if-no-files-found: error
          retention-days: 90
