name: NMIR pinned solar spectra

on:
  workflow_dispatch:
  push:
    paths:
      - "data/solar_spectrum_manifest.csv"
      - "src/nmir/solar_spectra.py"
      - ".github/workflows/spectra-materialize.yml"

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NMIR
        run: python -m pip install -e .
      - name: Materialize immutable spectra
        run: |
          mkdir -p artifacts/solar_spectra
          python -m nmir.solar_spectra artifacts/solar_spectra | tee artifacts/solar_spectra/SHA1SUMS.gitblob.txt
          test "$(find artifacts/solar_spectra -type f -name '*.csv' | wc -l)" -eq 8
      - name: Upload verified spectrum bundle
        uses: actions/upload-artifact@v4
        with:
          name: nmir-solar-spectra-${{ github.sha }}
          path: artifacts/solar_spectra/
          if-no-files-found: error
          retention-days: 90
