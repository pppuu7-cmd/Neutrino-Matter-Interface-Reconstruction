name: NMIR 0080c B-L CMB observational semantics

on:
  push:
    paths:
      - 'scripts/audit_esseili_kribs_cmb_semantics_0080c.py'
      - 'tests/test_audit_esseili_kribs_cmb_semantics_0080c.py'
      - 'research/prereg/0080c_bl_cmb_observational_semantics.md'
      - '.github/workflows/0080c-bl-cmb-observational-semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run dedicated tests
        run: python -m pytest -q tests/test_audit_esseili_kribs_cmb_semantics_0080c.py
      - name: Run frozen 0080c primary semantics audit
        run: python scripts/audit_esseili_kribs_cmb_semantics_0080c.py
      - name: Hash result
        if: always()
        run: |
          if [ -f esseili_kribs_cmb_semantics_0080c.json ]; then sha256sum esseili_kribs_cmb_semantics_0080c.json; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0080c-bl-cmb-observational-semantics
          path: esseili_kribs_cmb_semantics_0080c.json
          if-no-files-found: error
