name: NMIR 0073 PandaX arXiv source audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pandax-source-audit-0073.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and inspect primary arXiv source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/src
          urls=(
            'https://export.arxiv.org/e-print/2206.02339v3'
            'https://arxiv.org/e-print/2206.02339v3'
          )
          ok=0
          for u in "${urls[@]}"; do
            echo "FETCH $u"
            if curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 "$u" -o audit/2206.02339v3.src; then ok=1; break; fi
          done
          if [[ "$ok" != 1 ]]; then echo 'INFRASTRUCTURE_FAIL source transport' | tee audit/classification.txt; exit 2; fi
          sha256sum audit/2206.02339v3.src | tee audit/archive.sha256
          file audit/2206.02339v3.src | tee audit/archive.filetype
          if tar -tf audit/2206.02339v3.src > audit/tar-list.txt 2>audit/tar-error.txt; then
            tar -xf audit/2206.02339v3.src -C audit/src
          else
            echo 'INFRASTRUCTURE_FAIL source archive not tar-readable' | tee audit/classification.txt
            cat audit/tar-error.txt
            exit 3
          fi
          find audit/src -type f -printf '%P\n' | sort > audit/file-list.txt
          find audit/src -type f -exec sha256sum {} \; | sed 's#audit/src/##' | sort -k2 > audit/file-sha256.txt
          while IFS= read -r f; do printf '%s\t' "$f"; file -b "audit/src/$f"; done < audit/file-list.txt > audit/file-types.txt
          grep -RniE 'Fig(ure)?[[:space:].~]*(1|3)|includegraphics|efficien|acceptance|spectrum|background' audit/src --include='*.tex' --include='*.sty' --include='*.txt' > audit/references.txt || true
          python - <<'PY'
          from pathlib import Path
          import json, re
          root=Path('audit/src')
          files=sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())
          candidates=[]
          for f in files:
              low=f.lower()
              if any(k in low for k in ['fig','eff','accept','spectrum','background','bkg','data']):
                  candidates.append(f)
          tex='\n'.join(p.read_text(errors='ignore') for p in root.rglob('*.tex'))
          refs=re.findall(r'\\includegraphics(?:\[[^\]]*\])?\{([^}]+)\}',tex)
          out={'archive':'arXiv:2206.02339v3','files':files,'candidate_assets':candidates,'includegraphics_refs':refs}
          Path('audit/manifest.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          echo 'SOURCE_INSPECTION_COMPLETE' | tee audit/classification.txt
      - name: Upload immutable audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandax-source-audit-0073
          path: audit/
          if-no-files-found: error
