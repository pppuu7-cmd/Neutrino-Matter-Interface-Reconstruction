name: NMIR 0080b B-L CMB axis calibration

on:
  push:
    paths:
      - 'scripts/calibrate_esseili_kribs_cmb_axes_0080b.py'
      - 'tests/test_calibrate_esseili_kribs_cmb_axes_0080b.py'
      - 'research/prereg/0080b_bl_cmb_axis_calibration.md'
      - '.github/workflows/0080b-bl-cmb-axis-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pytest PyMuPDF
      - name: Run dedicated tests
        run: python -m pytest -q tests/test_calibrate_esseili_kribs_cmb_axes_0080b.py
      - name: Run frozen 0080b CMB calibration
        run: python scripts/calibrate_esseili_kribs_cmb_axes_0080b.py
      - name: Hash result
        if: always()
        run: |
          if [ -f esseili_kribs_cmb_axis_calibration_0080b.json ]; then sha256sum esseili_kribs_cmb_axis_calibration_0080b.json; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0080b-bl-cmb-axis-calibration
          path: esseili_kribs_cmb_axis_calibration_0080b.json
          if-no-files-found: error
