name: NMIR v2 0105a6q5a Argon official-release provenance inventory

on:
  workflow_dispatch:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'scripts/audit_0105a6q5a_argon_official_release_provenance_inventory.py'
      - 'tests/test_0105a6q5a_argon_official_release_provenance_inventory.py'
      - '.github/workflows/nmir_v2_0105a6q5a_argon_official_release_provenance_inventory.yml'
      - 'research/prereg/0105a6q5a_argon_official_release_provenance_inventory_preregistration.md'

permissions:
  contents: read

jobs:
  provenance-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen implementation
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run q5a guard tests
        run: python -m pytest -q tests/test_0105a6q5a_argon_official_release_provenance_inventory.py

      - name: Run q5a provenance/inventory audit
        run: |
          mkdir -p artifacts/0105a6q5a
          python scripts/audit_0105a6q5a_argon_official_release_provenance_inventory.py \
            --output artifacts/0105a6q5a/result.json \
            --git-sha "$GITHUB_SHA" \
            --local-record research/iterations/0105a3_coherent_direct_byte_lock_recovery_pass_20260910.md

      - name: Verify artifact contains no raw provider payloads
        run: |
          test "$(find artifacts/0105a6q5a -type f | wc -l)" -eq 1
          test -f artifacts/0105a6q5a/result.json
          python - <<'PY'
          import json
          p='artifacts/0105a6q5a/result.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['release_file_bytes_downloaded'] is False
          assert d['release_file_bytes_rehashed'] is False
          assert d['scientific_release_content_inspected'] is False
          assert d['pseudo_data_generated'] is False
          assert d['likelihood_evaluated'] is False
          assert d['observed_bsm_residual_inspected'] is False
          assert d['systematic_monte_carlo_preregistration_permission_percent'] == 0
          assert d['systematic_monte_carlo_execution_permission_percent'] == 0
          assert d['observed_bsm_residual_permission_percent'] == 0
          PY

      - name: Upload q5a immutable result payload
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q5a-argon-official-release-provenance-inventory
          path: artifacts/0105a6q5a/result.json
          if-no-files-found: error
          retention-days: 90
