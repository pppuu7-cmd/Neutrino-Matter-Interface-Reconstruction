name: NMIR 0081 B-L BBN observational semantics

on:
  push:
    paths:
      - 'scripts/audit_esseili_kribs_bbn_semantics_0081.py'
      - 'tests/test_audit_esseili_kribs_bbn_semantics_0081.py'
      - 'research/prereg/0081_bl_bbn_observational_semantics.md'
      - '.github/workflows/0081-bl-bbn-observational-semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run dedicated tests
        run: python -m pytest -q tests/test_audit_esseili_kribs_bbn_semantics_0081.py
      - name: Run frozen 0081 primary BBN semantics audit
        run: python scripts/audit_esseili_kribs_bbn_semantics_0081.py
      - name: Hash result
        if: always()
        run: |
          if [ -f esseili_kribs_bbn_semantics_0081.json ]; then sha256sum esseili_kribs_bbn_semantics_0081.json; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0081-bl-bbn-observational-semantics
          path: esseili_kribs_bbn_semantics_0081.json
          if-no-files-found: error
