name: NMIR v2 0105a5b R1f MCEq repository metadata preflight

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - '.github/workflows/nmir_v2_0105a5b_r1f_mceq_repository_metadata_preflight.yml'
      - 'scripts/audit_0105a5b_r1f_mceq_repository_metadata_preflight.py'
      - 'tests/test_0105a5b_r1f_mceq_repository_metadata_preflight.py'
      - 'research/prereg/0105a5b_r1f_mceq_repository_metadata_preflight_preregistration.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mceq-repository-metadata-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run R1f guards
        run: python -m pytest -q tests/test_0105a5b_r1f_mceq_repository_metadata_preflight.py
      - name: Execute frozen metadata-only preflight
        run: |
          mkdir -p artifacts/0105a5b_r1f
          python scripts/audit_0105a5b_r1f_mceq_repository_metadata_preflight.py --output artifacts/0105a5b_r1f/result.json --git-sha "$GITHUB_SHA"
          sha256sum artifacts/0105a5b_r1f/result.json > artifacts/0105a5b_r1f/result_sha256.txt
      - name: Verify prohibitions
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a5b_r1f/result.json'))
          assert d['source_code_inspected'] is False
          assert d['readme_inspected'] is False
          assert d['source_archives_downloaded'] is False
          assert d['standard_3nu_executed'] is False
          assert d['systematic_monte_carlo_executed'] is False
          assert d['observed_bsm_residual_inspected'] is False
          assert d['observed_bsm_residual_permission_percent']==0
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a5b-r1f-mceq-repository-metadata-preflight
          path: artifacts/0105a5b_r1f/
          if-no-files-found: error
          retention-days: 90
