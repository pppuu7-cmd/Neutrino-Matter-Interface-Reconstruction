name: NMIR v2 0105a5b R1k2 predecessor PISA semantic locator
on:
  push:
    branches: [research/0105-bsm-residual-reconstruction]
    paths:
      - '.github/workflows/nmir_v2_0105a5b_r1k2_predecessor_pisa_semantic_locator.yml'
      - 'scripts/audit_0105a5b_r1k2_predecessor_pisa_semantic_locator.py'
      - 'tests/test_0105a5b_r1k2_predecessor_pisa_semantic_locator.py'
      - 'research/prereg/0105a5b_r1k2_predecessor_pisa_semantic_locator_preregistration.md'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  predecessor-pisa-semantic-locator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run R1k2 guards
        run: python -m pytest -q tests/test_0105a5b_r1k2_predecessor_pisa_semantic_locator.py
      - name: Execute frozen semantic locator
        run: |
          mkdir -p artifacts/0105a5b_r1k2
          python scripts/audit_0105a5b_r1k2_predecessor_pisa_semantic_locator.py --output artifacts/0105a5b_r1k2/result.json --git-sha "$GITHUB_SHA"
          sha256sum artifacts/0105a5b_r1k2/result.json > artifacts/0105a5b_r1k2/result_sha256.txt
      - name: Verify prohibitions
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a5b_r1k2/result.json'))
          for k in ['pisa_repository_content_fetched','standard_3nu_executed','systematic_monte_carlo_executed','observed_bsm_residual_inspected']:
              assert d[k] is False
          assert d['observed_bsm_residual_permission_percent']==0
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a5b-r1k2-predecessor-pisa-semantic-locator
          path: artifacts/0105a5b_r1k2/
          if-no-files-found: error
          retention-days: 90
