name: NMIR v2 0105a6g Ar direct-file semantic recovery

# Transport-only retry trigger 2026-09-10; frozen scientific criteria, provider URLs and byte identities unchanged.
on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6g_argon_direct_file_semantic_recovery.md'
      - 'scripts/audit_0105a6g_argon_direct_file_semantic_recovery.py'
      - 'tests/test_0105a6g_argon_direct_file_semantic_recovery.py'
      - '.github/workflows/nmir_v2_0105a6g_argon_direct_file_semantic_recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  direct-provider-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout NMIR
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run deterministic guards
        run: python -m pytest -q tests/test_0105a6g_argon_direct_file_semantic_recovery.py
      - name: Recover and verify exact 0105a3 parent manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/0105a6g/parent
          gh api \
            -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10147580844/zip \
            > artifacts/0105a6g/parent/0105a3.zip
          echo 'b4d93c5e121ddbf503f9dd837fff1c356fd704342d48c5d243213ac599e26da4  artifacts/0105a6g/parent/0105a3.zip' | sha256sum -c -
          unzip -q artifacts/0105a6g/parent/0105a3.zip -d artifacts/0105a6g/parent/unpacked
          echo '5ccaea9ae1b59cb60d0db0a28b98a334d8fb32fb39a436301126a32fcd523091  artifacts/0105a6g/parent/unpacked/coherent_zenodo_direct_byte_manifest.json' | sha256sum -c -
      - name: Recover exact official Ar direct-provider bytes and semantic evidence
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          python scripts/audit_0105a6g_argon_direct_file_semantic_recovery.py \
            --parent-manifest artifacts/0105a6g/parent/unpacked/coherent_zenodo_direct_byte_manifest.json \
            --output artifacts/0105a6g/argon_direct_semantic_recovery.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6g/run_stdout.txt
          sha256sum artifacts/0105a6g/argon_direct_semantic_recovery.json \
            | tee artifacts/0105a6g/result_sha256.txt
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6g-argon-direct-semantic-recovery
          path: |
            artifacts/0105a6g/argon_direct_semantic_recovery.json
            artifacts/0105a6g/result_sha256.txt
            artifacts/0105a6g/run_stdout.txt
