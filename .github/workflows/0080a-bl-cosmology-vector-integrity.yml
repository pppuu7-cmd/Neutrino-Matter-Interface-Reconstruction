name: NMIR 0080a B-L cosmology vector integrity

on:
  push:
    paths:
      - 'scripts/audit_esseili_kribs_vector_integrity_0080a.py'
      - 'tests/test_audit_esseili_kribs_vector_integrity_0080a.py'
      - 'research/prereg/0080a_bl_cosmology_vector_integrity.md'
      - '.github/workflows/0080a-bl-cosmology-vector-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pytest PyMuPDF
      - name: Run dedicated tests
        run: python -m pytest -q tests/test_audit_esseili_kribs_vector_integrity_0080a.py
      - name: Run frozen 0080a vector-integrity audit
        run: python scripts/audit_esseili_kribs_vector_integrity_0080a.py
      - name: Hash result
        if: always()
        run: |
          if [ -f esseili_kribs_vector_integrity_0080a.json ]; then sha256sum esseili_kribs_vector_integrity_0080a.json; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0080a-bl-cosmology-vector-integrity
          path: esseili_kribs_vector_integrity_0080a.json
          if-no-files-found: error
