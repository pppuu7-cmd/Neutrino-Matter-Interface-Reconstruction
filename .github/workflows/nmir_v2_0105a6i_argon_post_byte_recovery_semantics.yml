name: NMIR v2 0105a6i Ar post-byte-recovery likelihood semantics

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6i_argon_post_byte_recovery_likelihood_semantics_audit_preregistration.md'
      - 'scripts/audit_0105a6i_argon_post_byte_recovery_likelihood_semantics.py'
      - 'tests/test_0105a6i_argon_post_byte_recovery_likelihood_semantics.py'
      - '.github/workflows/nmir_v2_0105a6i_argon_post_byte_recovery_semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-semantic-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run deterministic fail-closed guards
        run: python -m pytest -q tests/test_0105a6i_argon_post_byte_recovery_likelihood_semantics.py
      - name: Audit exact provider source semantics
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6i
          PYTHONPATH=. python scripts/audit_0105a6i_argon_post_byte_recovery_likelihood_semantics.py \
            --output artifacts/0105a6i/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6i/stdout.txt
          sha256sum artifacts/0105a6i/result.json | tee artifacts/0105a6i/result_sha256.txt
      - name: Upload authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6i-argon-post-byte-recovery-semantics
          path: artifacts/0105a6i/
          if-no-files-found: warn
