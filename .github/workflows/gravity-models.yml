name: NMIR Model-S projected lens gate

on:
  push:
    paths:
      - 'research/gravity_modelS_prereg.md'
      - 'src/nmir/gravity_extended.py'
      - 'tests/test_gravity_extended.py'
      - 'scripts/gravity_modelS_benchmark.py'
      - '.github/workflows/gravity-models.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_gravity_extended.py
      - run: mkdir -p artifacts/gravity_modelS
      - run: python scripts/gravity_modelS_benchmark.py | tee artifacts/gravity_modelS/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: gravity-modelS-result
          path: artifacts/gravity_modelS/result.json
