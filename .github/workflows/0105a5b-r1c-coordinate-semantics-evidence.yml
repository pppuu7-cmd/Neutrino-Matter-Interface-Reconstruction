name: NMIR v2 0105a5b R1c coordinate-semantics evidence

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a5b_r1c_deepcore_coordinate_semantics_preregistration.md'
      - 'scripts/audit_0105a5b_r1c_coordinate_semantics_evidence.py'
      - 'tests/test_audit_0105a5b_r1c_coordinate_semantics_evidence.py'
      - '.github/workflows/0105a5b-r1c-coordinate-semantics-evidence.yml'
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen test runtime
        run: python -m pip install pytest
      - name: Run dedicated R1c evidence tests
        run: python -m pytest -q tests/test_audit_0105a5b_r1c_coordinate_semantics_evidence.py
      - name: Collect exact frozen B4RITM v1.0 authority evidence
        run: |
          mkdir -p r1c_authority
          python -m scripts.audit_0105a5b_r1c_coordinate_semantics_evidence \
            --output r1c_result.json \
            --raw-dir r1c_authority
          sha256sum r1c_result.json | tee r1c_result.sha256
          find r1c_authority -type f -print0 | sort -z | xargs -0 sha256sum > r1c_authority.sha256
      - name: Record execution provenance
        if: always()
        run: |
          cat > execution_provenance.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "job": "${GITHUB_JOB}",
            "head_sha": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "event": "${GITHUB_EVENT_NAME}",
            "scientific_pass_declared": false,
            "observed_bsm_residual_permission_percent": 0
          }
          EOF
          sha256sum execution_provenance.json > execution_provenance.sha256
      - name: Upload raw R1c authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepcore-0105a5b-r1c-authority-evidence
          path: |
            r1c_result.json
            r1c_result.sha256
            r1c_authority/
            r1c_authority.sha256
            execution_provenance.json
            execution_provenance.sha256
          if-no-files-found: warn
