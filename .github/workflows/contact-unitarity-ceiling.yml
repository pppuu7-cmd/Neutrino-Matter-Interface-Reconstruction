name: NMIR G3 contact inclusive unitarity ceiling

on:
  push:
    paths:
      - 'src/nmir/contact_unitarity_ceiling.py'
      - 'tests/test_contact_unitarity_ceiling.py'
      - 'scripts/contact_unitarity_ceiling_benchmark.py'
      - 'data/solar_flux_b16.csv'
      - 'data/solar_spectrum_manifest.csv'
      - 'data/be7_bahcall1994_ground_profile.csv'
      - '.github/workflows/contact-unitarity-ceiling.yml'
  workflow_dispatch:

jobs:
  scientific-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependency
        run: python -m pip install -e . pytest
      - name: Run dedicated 0062 regression tests
        run: pytest -q tests/test_contact_unitarity_ceiling.py
      - name: Run fail-closed 0062 benchmark
        run: python scripts/contact_unitarity_ceiling_benchmark.py
      - name: Upload scientific result
        uses: actions/upload-artifact@v4
        with:
          name: nmir-g3-0062-contact-unitarity
          path: contact_unitarity_ceiling_result.json
          if-no-files-found: error
