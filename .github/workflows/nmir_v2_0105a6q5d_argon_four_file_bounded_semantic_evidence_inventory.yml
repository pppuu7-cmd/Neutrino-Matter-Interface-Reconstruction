name: NMIR v2 0105a6q5d Argon bounded semantic evidence inventory
on:
  push:
    branches: [research/0105-bsm-residual-reconstruction]
    paths: ['.github/workflows/nmir_v2_0105a6q5d_argon_four_file_bounded_semantic_evidence_inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-evidence-inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run dedicated guards
        run: python -m pytest -q tests/test_0105a6q5d_argon_four_file_bounded_semantic_evidence_inventory.py
      - name: Execute frozen q5d inventory
        run: |
          mkdir -p artifacts/0105a6q5d
          python scripts/audit_0105a6q5d_argon_four_file_bounded_semantic_evidence_inventory.py --output artifacts/0105a6q5d/result.json --git-sha "$GITHUB_SHA"
      - name: Verify hard guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a6q5d/result.json'))
          for k in ['pseudo_data_generated','likelihood_evaluated','fit_executed','nuisance_profiled','systematic_monte_carlo_executed','observed_bsm_residual_inspected']:
              assert d[k] is False
          assert d['systematic_monte_carlo_preregistration_permission_percent']==0
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          assert d['observed_bsm_residual_permission_percent']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q5d-argon-bounded-semantic-evidence-inventory
          path: artifacts/0105a6q5d/result.json
          if-no-files-found: error
          retention-days: 90
