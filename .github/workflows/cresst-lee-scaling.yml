name: NMIR CRESST LEE scaling gap gate

on:
  push:
    paths:
      - 'research/prereg/0053_cresst_lee_scaling_gap.md'
      - 'src/nmir/cresst_lee_scaling.py'
      - 'tests/test_cresst_lee_scaling.py'
      - 'scripts/cresst_lee_scaling_benchmark.py'
      - '.github/workflows/cresst-lee-scaling.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_cresst_lee_scaling.py
      - run: mkdir -p artifacts/cresst_lee_scaling
      - name: Run fail-closed frozen benchmark
        shell: bash
        run: |
          set -o pipefail
          python scripts/cresst_lee_scaling_benchmark.py | tee artifacts/cresst_lee_scaling/result.json
          grep -q 'PASS_LEE_SCALING_GAP_STRESS' artifacts/cresst_lee_scaling/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: cresst-lee-scaling-result
          path: artifacts/cresst_lee_scaling/result.json
