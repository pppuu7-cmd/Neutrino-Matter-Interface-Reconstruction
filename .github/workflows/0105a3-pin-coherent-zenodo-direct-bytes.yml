name: 0105a3 pin COHERENT Zenodo direct bytes

on:
  push:
    paths:
      - 'research/prereg/0105a3_coherent_zenodo_direct_byte_lock_preflight.md'
      - 'scripts/pin_0105a3_coherent_zenodo_direct_bytes.py'
      - 'tests/test_pin_0105a3_coherent_zenodo_direct_bytes.py'
      - '.github/workflows/0105a3-pin-coherent-zenodo-direct-bytes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  byte-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout 0105a3 code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run deterministic byte-lock tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_pin_0105a3_coherent_zenodo_direct_bytes.py

      - name: Hash all frozen COHERENT Zenodo release files
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a3
          python scripts/pin_0105a3_coherent_zenodo_direct_bytes.py \
            --output-dir artifacts/0105a3 \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a3/run_stdout.txt

      - name: Assert byte-lock and non-discovery guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path('artifacts/0105a3/coherent_zenodo_direct_byte_manifest.json').read_text())
          assert x['status'] == 'PASS_0105A3_COHERENT_ZENODO_DIRECT_BYTE_LOCK_NONTERMINAL'
          assert x['coherent_event_byte_lock_complete'] is True
          assert x['observed_residual_execution_allowed'] is False
          assert x['releases']['csi']['file_count'] == 13
          assert x['releases']['ar']['file_count'] == 24
          assert x['gates']['all_provider_md5_match']
          assert x['gates']['all_sha256_recorded']
          PY

      - name: Upload hash manifest only
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a3-coherent-byte-lock
          path: |
            artifacts/0105a3/coherent_zenodo_direct_byte_manifest.json
            artifacts/0105a3/manifest_sha256.txt
            artifacts/0105a3/run_stdout.txt
          if-no-files-found: error
