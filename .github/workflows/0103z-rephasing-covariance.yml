name: 0103Z six-state rephasing covariance

on:
  push:
    paths:
      - '.github/workflows/0103z-rephasing-covariance.yml'
      - 'research/prereg/0103yz_independent_solver_and_rephasing_prereg.md'
      - 'scripts/audit_0103z_rephasing_covariance.py'
      - 'tests/test_audit_0103z_rephasing_covariance.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rephasing-covariance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Focused rephasing covariance test
        run: pytest -q tests/test_audit_0103z_rephasing_covariance.py
      - name: Emit evidence
        run: python scripts/audit_0103z_rephasing_covariance.py | tee 0103z_metrics.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0103z-rephasing-covariance
          path: 0103z_metrics.json
          if-no-files-found: warn

