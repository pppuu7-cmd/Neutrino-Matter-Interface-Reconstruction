name: NMIR v2 0105a6q5a3 Argon Zenodo metadata byte-lock crosswalk

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'scripts/audit_0105a6q5a3_argon_zenodo_metadata_byte_lock_crosswalk.py'
      - 'tests/test_0105a6q5a3_argon_zenodo_metadata_byte_lock_crosswalk.py'
      - '.github/workflows/nmir_v2_0105a6q5a3_argon_zenodo_metadata_byte_lock_crosswalk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen implementation
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic test dependency
        run: python -m pip install pytest==8.3.5
      - name: Run q5a3 guard tests
        run: python -m pytest -q tests/test_0105a6q5a3_argon_zenodo_metadata_byte_lock_crosswalk.py
      - name: Run q5a3 metadata crosswalk
        run: python scripts/audit_0105a6q5a3_argon_zenodo_metadata_byte_lock_crosswalk.py
      - name: Verify hard guards and artifact contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('result.json'))
          assert r['preregistration_commit']=='c2365cd050cdac581934ae8ce6254afeff3d2bd3'
          for k in ['release_file_bytes_downloaded','release_file_bytes_rehashed','scientific_release_content_inspected','linked_file_urls_requested','pseudo_data_generated','likelihood_evaluated','nuisance_profiled','observed_bsm_residual_inspected','bsm_fit_executed']:
              assert r[k] is False, (k,r[k])
          assert r['systematic_monte_carlo_preregistration_permission_percent']==0
          assert r['systematic_monte_carlo_execution_permission_percent']==0
          assert r['observed_bsm_residual_permission_percent']==0
          PY
      - name: Upload immutable result payload
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q5a3-argon-zenodo-metadata-byte-lock-crosswalk
          path: result.json
          if-no-files-found: error
