name: NMIR v2 0105a5b R1m1 CSMS 2011 archive structure
on:
  push:
    branches: [research/0105-bsm-residual-reconstruction]
    paths:
      - '.github/workflows/nmir_v2_0105a5b_r1m1_csms2011_archive_structure.yml'
      - 'scripts/audit_0105a5b_r1m1_csms2011_archive_structure.py'
      - 'tests/test_0105a5b_r1m1_csms2011_archive_structure.py'
      - 'research/prereg/0105a5b_r1m1_csms2011_archive_structure_preregistration.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  csms2011-archive-structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run R1m1 guards
        run: python -m pytest -q tests/test_0105a5b_r1m1_csms2011_archive_structure.py
      - name: Enumerate byte-locked CSMS archive structure only
        run: |
          mkdir -p artifacts/0105a5b_r1m1
          python scripts/audit_0105a5b_r1m1_csms2011_archive_structure.py --output artifacts/0105a5b_r1m1/result.json --git-sha "$GITHUB_SHA"
          sha256sum artifacts/0105a5b_r1m1/result.json > artifacts/0105a5b_r1m1/result_sha256.txt
      - name: Verify hard prohibitions
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a5b_r1m1/result.json'))
          assert d['byte_lock_verified'] is True and d['archive_opened'] is True
          for k in ['member_payload_read','source_text_inspected','csms_nuisance_semantics_inferred','standard_3nu_executed','systematic_monte_carlo_executed','observed_bsm_residual_inspected']: assert d[k] is False
          assert d['observed_bsm_residual_permission_percent']==0 and d['systematic_monte_carlo_execution_permission_percent']==0
          assert d['classification']=='PASS_0105A5B_R1M1_CSMS2011_ARCHIVE_STRUCTURE_LOCATED_NONDISCOVERY'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a5b-r1m1-csms2011-archive-structure
          path: artifacts/0105a5b_r1m1/
          if-no-files-found: error
          retention-days: 90
