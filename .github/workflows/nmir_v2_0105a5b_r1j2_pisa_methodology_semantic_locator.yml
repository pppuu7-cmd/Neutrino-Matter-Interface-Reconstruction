name: NMIR v2 0105a5b R1j2 PISA methodology semantic locator
on:
  push:
    branches: [research/0105-bsm-residual-reconstruction]
    paths:
      - '.github/workflows/nmir_v2_0105a5b_r1j2_pisa_methodology_semantic_locator.yml'
      - 'scripts/audit_0105a5b_r1j2_pisa_methodology_semantic_locator.py'
      - 'tests/test_0105a5b_r1j2_pisa_methodology_semantic_locator.py'
      - 'research/prereg/0105a5b_r1j2_pisa_methodology_semantic_locator_preregistration.md'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  semantic-locator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run R1j2 guards
        run: python -m pytest -q tests/test_0105a5b_r1j2_pisa_methodology_semantic_locator.py
      - name: Execute frozen semantic locator
        run: |
          mkdir -p artifacts/0105a5b_r1j2
          python scripts/audit_0105a5b_r1j2_pisa_methodology_semantic_locator.py --output artifacts/0105a5b_r1j2/result.json --git-sha "$GITHUB_SHA"
          sha256sum artifacts/0105a5b_r1j2/result.json > artifacts/0105a5b_r1j2/result_sha256.txt
      - name: Verify prohibitions
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a5b_r1j2/result.json'))
          assert d['pisa_repository_content_fetched'] is False
          assert d['standard_3nu_executed'] is False
          assert d['systematic_monte_carlo_executed'] is False
          assert d['observed_bsm_residual_inspected'] is False
          assert d['observed_bsm_residual_permission_percent']==0
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a5b-r1j2-pisa-methodology-semantic-locator
          path: artifacts/0105a5b_r1j2/
          if-no-files-found: error
          retention-days: 90
