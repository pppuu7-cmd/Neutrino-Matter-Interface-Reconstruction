name: NMIR CRESST silicon transfer fold gate

on:
  push:
    paths:
      - 'research/prereg/0052_cresst_si_transfer_fold.md'
      - 'src/nmir/cresst_si_transfer.py'
      - 'tests/test_cresst_si_transfer.py'
      - 'scripts/cresst_si_transfer_benchmark.py'
      - '.github/workflows/cresst-si-transfer.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_cresst_si_transfer.py
      - run: mkdir -p artifacts/cresst_si_transfer
      - name: Run fail-closed frozen benchmark
        shell: bash
        run: |
          set -o pipefail
          python scripts/cresst_si_transfer_benchmark.py | tee artifacts/cresst_si_transfer/result.json
          grep -q 'PASS_CRESST_SI_TRANSFER_FOLD' artifacts/cresst_si_transfer/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: cresst-si-transfer-result
          path: artifacts/cresst_si_transfer/result.json
