name: NMIR 0072 Wagner source audit

on:
  push:
    paths:
      - 'scripts/materialize_wagner_source_0072.py'
      - 'scripts/probe_wagner_eps_0072.py'
      - 'scripts/summarize_wagner_eps_paths_0072.py'
      - 'scripts/summarize_wagner_geometry_0072.py'
      - 'scripts/extract_wagner_axis_ticks_0072a.py'
      - 'data/wagner_figure6_tick_authority_0072a.json'
      - '.github/workflows/b-minus-l-wagner-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize primary arXiv source archive
        run: |
          mkdir -p artifacts data
          python scripts/materialize_wagner_source_0072.py --output artifacts/wagner_source_audit_0072.json
          python scripts/probe_wagner_eps_0072.py --output artifacts/wagner_eps_probe_0072.json
          python scripts/summarize_wagner_eps_paths_0072.py --output artifacts/wagner_eps_paths_0072.json
          python scripts/summarize_wagner_geometry_0072.py --paths-json artifacts/wagner_eps_paths_0072.json --output artifacts/wagner_geometry_summary_0072.json
          python scripts/extract_wagner_axis_ticks_0072a.py --output artifacts/wagner_axis_ticks_0072a.json
      - name: Show raw audit results
        if: always()
        run: |
          cat artifacts/wagner_source_audit_0072.json || true
          cat artifacts/wagner_eps_probe_0072.json || true
          cat artifacts/wagner_geometry_summary_0072.json || true
          cat artifacts/wagner_axis_ticks_0072a.json || true
          sha256sum artifacts/*.json || true
      - name: Persist auditable results on main
        if: success()
        run: |
          cp artifacts/wagner_source_audit_0072.json data/wagner_source_audit_0072.json
          cp artifacts/wagner_eps_probe_0072.json data/wagner_eps_probe_0072.json
          cp artifacts/wagner_eps_paths_0072.json data/wagner_eps_paths_0072.json
          cp artifacts/wagner_geometry_summary_0072.json data/wagner_geometry_summary_0072.json
          cp artifacts/wagner_axis_ticks_0072a.json data/wagner_axis_ticks_0072a.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/wagner_source_audit_0072.json data/wagner_eps_probe_0072.json data/wagner_eps_paths_0072.json data/wagner_geometry_summary_0072.json data/wagner_axis_ticks_0072a.json
          if git diff --cached --quiet; then
            echo 'No result change to commit.'
          else
            git commit -m 'Record hosted Wagner axis geometry for 0072a'
            git push
          fi
      - name: Upload immutable audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wagner-source-audit-0072
          path: artifacts/*.json
          if-no-files-found: error
