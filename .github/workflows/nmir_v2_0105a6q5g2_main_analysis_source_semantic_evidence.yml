name: NMIR v2 0105a6q5g2 main Analysis-A source semantic evidence
on:
  push:
    branches: [research/0105-bsm-residual-reconstruction]
    paths: ['.github/workflows/nmir_v2_0105a6q5g2_main_analysis_source_semantic_evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  main-source-semantic-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run dedicated guards
        run: python -m pytest -q tests/test_0105a6q5g2_main_analysis_source_semantic_evidence.py
      - name: Execute frozen q5g2 semantic audit
        run: |
          mkdir -p artifacts/0105a6q5g2
          python scripts/audit_0105a6q5g2_main_analysis_source_semantic_evidence.py --output artifacts/0105a6q5g2/result.json --git-sha "$GITHUB_SHA"
      - name: Verify hard guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a6q5g2/result.json'))
          assert d['likelihood_evaluated'] is False
          assert d['pseudo_data_generated'] is False
          assert d['optimizer_executed'] is False
          assert d['systematic_monte_carlo_executed'] is False
          assert d['observed_bsm_residual_inspected'] is False
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          assert d['observed_bsm_residual_permission_percent']==0
          assert set(d['candidate_set'])=={'authors.tex','commands.tex','main.bbl','main.bib','main.tex','supplemental.tex'}
          assert d['f4_inherited_status']=='RESOLVED_EXPLICIT_SEPARATE_ALTERNATIVE_FITS'
          assert d['f6_inherited_status']=='RESOLVED_EXPLICIT_SEPARATE_SYSTEMATIC_FITS'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q5g2-main-analysis-source-semantic-evidence
          path: artifacts/0105a6q5g2/result.json
          if-no-files-found: error
          retention-days: 90
