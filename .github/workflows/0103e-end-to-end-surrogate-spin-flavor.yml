name: 0103E end-to-end surrogate spin-flavor

on:
  push:
    paths:
      - '.github/workflows/0103e-end-to-end-surrogate-spin-flavor.yml'
      - 'research/prereg/0103e_end_to_end_surrogate_spin_flavor.md'
      - 'scripts/audit_0103e_end_to_end_surrogate_spin_flavor.py'
      - 'tests/test_audit_0103e_end_to_end_surrogate_spin_flavor.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propagate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Focused end-to-end test
        run: pytest -q tests/test_audit_0103e_end_to_end_surrogate_spin_flavor.py
      - name: Emit propagation evidence
        run: python scripts/audit_0103e_end_to_end_surrogate_spin_flavor.py | tee 0103e_end_to_end.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0103e-end-to-end-surrogate-spin-flavor
          path: 0103e_end_to_end.json
          if-no-files-found: warn
