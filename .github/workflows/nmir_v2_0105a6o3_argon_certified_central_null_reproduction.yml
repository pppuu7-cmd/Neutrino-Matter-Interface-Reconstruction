name: NMIR v2 0105a6o3 Ar certified central null reproduction

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6o3_argon_certified_central_null_reproduction_preregistration.md'
      - 'scripts/run_0105a6o3_argon_certified_central_null_reproduction.py'
      - 'tests/test_0105a6o3_argon_certified_central_null_reproduction.py'
      - '.github/workflows/nmir_v2_0105a6o3_argon_certified_central_null_reproduction.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certified-central-null:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check mpmath pytest
      - name: Run frozen reproduction guards
        run: python -m pytest -q tests/test_0105a6o3_argon_certified_central_null_reproduction.py
      - name: Recover exact 0105a6p central bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/0105a6o3/input
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10160794369/zip \
            > artifacts/0105a6o3/input/a6p.zip
          echo 'a66b3408b22b14575f156c0be7c389589dd9865ada1f4769fe8366a1df65ec82  artifacts/0105a6o3/input/a6p.zip' | sha256sum -c -
          unzip -q artifacts/0105a6o3/input/a6p.zip -d artifacts/0105a6o3/input/a6p
          echo '5b1df47a50dd4dbb2a7fbd5ee64346c2854bdbad0540bfa6f16637eb10b6bada  artifacts/0105a6o3/input/a6p/manifest.json' | sha256sum -c -
      - name: Recover exact 0105a6o2 parent certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10163470626/zip \
            > artifacts/0105a6o3/input/a6o2.zip
          echo '8ca17ecfeeabe05bee6305a3bbb2dc6ac2eb5877ffeb67a14e74df165c2dbcc0  artifacts/0105a6o3/input/a6o2.zip' | sha256sum -c -
          mkdir -p artifacts/0105a6o3/input/a6o2
          unzip -q artifacts/0105a6o3/input/a6o2.zip -d artifacts/0105a6o3/input/a6o2
          echo 'e3790cb7e2459ef900fda2cfe430be8d47fe497c1365f9c12762bef3f9599d73  artifacts/0105a6o3/input/a6o2/result.json' | sha256sum -c -
      - name: Execute prospectively frozen certified central-null reproduction
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/run_0105a6o3_argon_certified_central_null_reproduction.py \
            --files-dir artifacts/0105a6o3/input/a6p/reconstructed_exact_official_bytes \
            --a6p-manifest artifacts/0105a6o3/input/a6p/manifest.json \
            --a6o2-result artifacts/0105a6o3/input/a6o2/result.json \
            --output artifacts/0105a6o3/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6o3/stdout.txt
          sha256sum artifacts/0105a6o3/result.json | tee artifacts/0105a6o3/result_sha256.txt
      - name: Remove exact inputs before result upload
        if: always()
        run: rm -rf artifacts/0105a6o3/input
      - name: Upload certified null result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6o3-argon-certified-central-null
          path: |
            artifacts/0105a6o3/result.json
            artifacts/0105a6o3/result_sha256.txt
            artifacts/0105a6o3/stdout.txt
          if-no-files-found: warn
