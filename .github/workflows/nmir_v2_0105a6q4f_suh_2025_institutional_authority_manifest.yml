name: NMIR v2 0105a6q4f Suh 2025 institutional authority manifest

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6q4f_suh_2025_institutional_authority_manifest_preregistration.md'
      - 'scripts/audit_0105a6q4f_suh_2025_institutional_authority_manifest.py'
      - 'tests/test_0105a6q4f_suh_2025_institutional_authority_manifest.py'
      - '.github/workflows/nmir_v2_0105a6q4f_suh_2025_institutional_authority_manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  institutional-authority-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run frozen q4f guards
        run: python -m pytest -q tests/test_0105a6q4f_suh_2025_institutional_authority_manifest.py
      - name: Execute metadata-only institutional authority manifest
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6q4f
          PYTHONPATH=. python scripts/audit_0105a6q4f_suh_2025_institutional_authority_manifest.py \
            --output artifacts/0105a6q4f/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6q4f/stdout.txt
          sha256sum artifacts/0105a6q4f/result.json | tee artifacts/0105a6q4f/result_sha256.txt
      - name: Upload q4f structured metadata result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q4f-suh-2025-institutional-authority-manifest
          path: |
            artifacts/0105a6q4f/result.json
            artifacts/0105a6q4f/result_sha256.txt
            artifacts/0105a6q4f/stdout.txt
          if-no-files-found: warn
