name: Known-model funnel readiness audit

on:
  push:
    paths:
      - 'research/benchmarks/KNOWN_MODEL_BENCHMARK_MATRIX.md'
      - 'research/prereg/0100_known_model_benchmark_standard_3flavor_msw.md'
      - 'research/prereg/0100a_farmer_source_profile_pinning.md'
      - 'research/prereg/0101_known_model_benchmark_3p1_sterile_preflight.md'
      - 'research/prereg/0102_known_model_benchmark_nsi_preflight.md'
      - 'research/prereg/0103_known_model_benchmark_magnetic_spin_flavor_preflight.md'
      - 'research/prereg/0104_known_model_benchmark_light_mediator_preflight.md'
      - 'scripts/benchmark_0100_standard_3flavor_msw.py'
      - 'scripts/benchmark_0101_0104_known_models_preflight.py'
      - 'scripts/audit_known_model_funnel_readiness.py'
      - 'tests/test_known_model_funnel_readiness.py'
      - '.github/workflows/known-model-funnel-readiness.yml'
      - 'research/locks/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest

      - name: Run readiness test
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_known_model_funnel_readiness.py

      - name: Emit readiness artifact
        env:
          PYTHONPATH: .
        run: |
          mkdir -p artifacts/readiness
          python scripts/audit_known_model_funnel_readiness.py | tee artifacts/readiness/known_model_funnel_readiness.json

      - name: Assert execution framework is 100 percent ready
        run: |
          python - <<'PY'
          import json
          with open('artifacts/readiness/known_model_funnel_readiness.json', encoding='utf-8') as f:
              result = json.load(f)
          assert result['repository_execution_framework_ready'] is True
          assert result['repository_execution_framework_percent'] == 100
          assert result['interpretation']['blocked_is_not_fail'] is True
          PY

      - name: Upload readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmir-known-model-funnel-readiness
          path: artifacts/readiness/known_model_funnel_readiness.json
          if-no-files-found: error
