name: NMIR v2 0105a5b R1e repository authority-route inventory

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - '.github/workflows/nmir_v2_0105a5b_r1e_repository_authority_route_inventory.yml'
      - 'scripts/audit_0105a5b_r1e_repository_authority_route_inventory.py'
      - 'tests/test_0105a5b_r1e_repository_authority_route_inventory.py'
      - 'research/prereg/0105a5b_r1e_repository_authority_route_inventory_preregistration.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-authority-route-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run R1e guards
        run: python -m pytest -q tests/test_0105a5b_r1e_repository_authority_route_inventory.py
      - name: Execute frozen repository-only authority inventory
        run: |
          mkdir -p artifacts/0105a5b_r1e
          python scripts/audit_0105a5b_r1e_repository_authority_route_inventory.py --output artifacts/0105a5b_r1e/result.json --git-sha "$GITHUB_SHA"
          sha256sum artifacts/0105a5b_r1e/result.json > artifacts/0105a5b_r1e/result_sha256.txt
      - name: Verify prohibitions
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a5b_r1e/result.json'))
          assert d['network_requests_executed'] is False
          assert d['external_files_acquired'] is False
          assert d['links_followed'] is False
          assert d['standard_3nu_executed'] is False
          assert d['systematic_monte_carlo_executed'] is False
          assert d['observed_bsm_residual_inspected'] is False
          assert d['observed_bsm_residual_permission_percent']==0
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a5b-r1e-repository-authority-route-inventory
          path: artifacts/0105a5b_r1e/
          if-no-files-found: error
          retention-days: 90

