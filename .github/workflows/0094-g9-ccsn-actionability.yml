name: 0094 G9 CCSN prospective actionability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/g9_ccsn_actionability_0094.py'
      - 'tests/test_g9_ccsn_actionability_0094.py'
      - 'research/prereg/0094_g9_ccsn_prospective_actionability_closure.md'
      - '.github/workflows/0094-g9-ccsn-actionability.yml'

permissions:
  contents: read
  actions: read

jobs:
  actionability:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run dedicated tests
        run: python -m pytest -q tests/test_g9_ccsn_actionability_0094.py
      - name: Download exact validated 0093 parent artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10077508208/zip \
            -o parent0093.zip
          echo "1bef56077626433de111870e8c41c6a5460f8c6cc7d332b58171ded2015c73e6  parent0093.zip" | sha256sum -c -
          unzip -q parent0093.zip -d parent0093
          echo "9a5aea9e1d3fd00a16781870e93ee95956a3886ed47edb3a244155ce0dd23a5b  parent0093/g9_0093_result.json" | sha256sum -c -
      - name: Execute exact frozen 0094 actionability classification
        run: |
          python scripts/g9_ccsn_actionability_0094.py \
            --parent parent0093/g9_0093_result.json \
            --output g9_0094_result.json
      - name: Hash result
        run: sha256sum g9_0094_result.json
      - name: Upload authority artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmir-g9-0094-authoritative
          path: g9_0094_result.json
          if-no-files-found: error
      - name: Preserve frozen classification exit
        run: |
          python - <<'PY'
          import json
          s=json.load(open('g9_0094_result.json'))['status']
          print('0094 status:',s)
          if s.startswith('INFRASTRUCTURE_FAIL_'):
              raise SystemExit(1)
          PY
