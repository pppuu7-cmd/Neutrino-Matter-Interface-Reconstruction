name: research-0105a-q7-hosted-validation

on:
  push:
    branches: [research/0105-bsm-residual-reconstruction]
    paths:
      - 'research/amendment_0105a_q7_hosted_validation.md'
      - 'scripts/validate_0105a_q7_lar_version_history_f7.py'
      - 'tests/test_0105a_q7_lar_version_history_f7.py'
      - '.github/workflows/research-0105a-q7-hosted-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-q7:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install execution dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Run guards
        run: python -m pytest -q tests/test_0105a_q7_lar_version_history_f7.py
      - name: Run hosted q7 validator
        run: python scripts/validate_0105a_q7_lar_version_history_f7.py
      - name: Hash outputs
        run: sha256sum results/0105a_q7_validation/* | tee results/0105a_q7_validation/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-0105a-q7-hosted-validation
          path: results/0105a_q7_validation/
          if-no-files-found: error
          retention-days: 90
