name: NMIR Se82 pp validation
on:
  push:
    paths:
      - 'src/nmir/se82_response.py'
      - 'src/nmir/se82_validation.py'
      - 'scripts/se82_pp_validation_benchmark.py'
      - '.github/workflows/se82-pp-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce published Se-82 pp source-average cross section
        run: PYTHONPATH=src python scripts/se82_pp_validation_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: se82-pp-validation
          path: artifacts/se82_pp_validation/results.json
          if-no-files-found: error
