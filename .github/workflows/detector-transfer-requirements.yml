name: NMIR detector transfer rate requirement gate

on:
  push:
    paths:
      - 'research/detector_transfer_rate_requirement_prereg.md'
      - 'src/nmir/detector_transfer_requirements.py'
      - 'tests/test_detector_transfer_requirements.py'
      - 'scripts/detector_transfer_requirements_benchmark.py'
      - '.github/workflows/detector-transfer-requirements.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_detector_transfer_requirements.py
      - run: mkdir -p artifacts/detector_transfer_requirements
      - name: Run fail-closed frozen benchmark
        shell: bash
        run: |
          set -o pipefail
          python scripts/detector_transfer_requirements_benchmark.py | tee artifacts/detector_transfer_requirements/result.json
          grep -q 'PASS_DETECTOR_TRANSFER_RATE_REQUIREMENT' artifacts/detector_transfer_requirements/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: detector-transfer-requirements-result
          path: artifacts/detector_transfer_requirements/result.json
