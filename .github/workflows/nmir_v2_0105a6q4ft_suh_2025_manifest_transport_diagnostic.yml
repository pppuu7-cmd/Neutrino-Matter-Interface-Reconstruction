name: NMIR v2 0105a6q4ft Suh 2025 manifest transport diagnostic

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6q4ft_suh_2025_manifest_transport_diagnostic_preregistration.md'
      - 'scripts/audit_0105a6q4ft_suh_2025_manifest_transport_diagnostic.py'
      - 'tests/test_0105a6q4ft_suh_2025_manifest_transport_diagnostic.py'
      - '.github/workflows/nmir_v2_0105a6q4ft_suh_2025_manifest_transport_diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run q4ft guards
        run: python -m pytest -q tests/test_0105a6q4ft_suh_2025_manifest_transport_diagnostic.py
      - name: Probe frozen metadata endpoints only
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6q4ft
          python scripts/audit_0105a6q4ft_suh_2025_manifest_transport_diagnostic.py \
            --output artifacts/0105a6q4ft/result.json \
            --git-sha "$GITHUB_SHA" | tee artifacts/0105a6q4ft/stdout.txt
          sha256sum artifacts/0105a6q4ft/result.json | tee artifacts/0105a6q4ft/result_sha256.txt
      - name: Upload structured transport diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q4ft-suh-2025-manifest-transport-diagnostic
          path: |
            artifacts/0105a6q4ft/result.json
            artifacts/0105a6q4ft/result_sha256.txt
            artifacts/0105a6q4ft/stdout.txt
          if-no-files-found: warn
