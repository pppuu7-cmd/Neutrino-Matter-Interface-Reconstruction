name: NMIR v2 0105a6q5g1 main Analysis-A archive structure
on:
  push:
    branches: [research/0105-bsm-residual-reconstruction]
    paths: ['.github/workflows/nmir_v2_0105a6q5g1_main_analysis_source_archive_structure.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-archive-structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run dedicated guards
        run: python -m pytest -q tests/test_0105a6q5g1_main_analysis_source_archive_structure.py
      - name: Execute frozen q5g1 locator
        run: |
          mkdir -p artifacts/0105a6q5g1
          python scripts/audit_0105a6q5g1_main_analysis_source_archive_structure.py --output artifacts/0105a6q5g1/result.json --git-sha "$GITHUB_SHA"
      - name: Verify hard guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a6q5g1/result.json'))
          assert d['member_content_read'] is False
          assert d['source_text_inspected'] is False
          assert d['likelihood_evaluated'] is False
          assert d['pseudo_data_generated'] is False
          assert d['systematic_monte_carlo_executed'] is False
          assert d['observed_bsm_residual_inspected'] is False
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          assert d['observed_bsm_residual_permission_percent']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q5g1-main-analysis-archive-structure
          path: artifacts/0105a6q5g1/result.json
          if-no-files-found: error
          retention-days: 90