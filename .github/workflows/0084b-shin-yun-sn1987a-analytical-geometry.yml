name: NMIR 0084b Shin-Yun SN1987A analytical geometry
on:
  push:
    branches: [main]
    paths:
      - 'research/inputs/0084b_shin_yun_geometry_authority_freeze.md'
      - 'scripts/audit_shin_yun_sn1987a_analytical_geometry_0084b.py'
      - 'tests/test_audit_shin_yun_sn1987a_analytical_geometry_0084b.py'
      - '.github/workflows/0084b-shin-yun-sn1987a-analytical-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pytest
      - name: Run dedicated tests
        run: python -m pytest -q tests/test_audit_shin_yun_sn1987a_analytical_geometry_0084b.py
      - name: Run frozen 0084b audit
        id: audit
        continue-on-error: true
        run: python scripts/audit_shin_yun_sn1987a_analytical_geometry_0084b.py
      - name: Hash result
        if: always()
        run: if [ -f shin_yun_sn1987a_analytical_geometry_0084b.json ]; then sha256sum shin_yun_sn1987a_analytical_geometry_0084b.json; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0084b-shin-yun-sn1987a-analytical-geometry
          path: shin_yun_sn1987a_analytical_geometry_0084b.json
          if-no-files-found: error
      - name: Enforce frozen classification
        if: always()
        run: test "${{ steps.audit.outcome }}" = "success"
