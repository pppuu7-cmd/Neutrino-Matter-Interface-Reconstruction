name: NMIR v2 0105a6q2 Ar pseudo-data count-law locator

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6q2_argon_pseudodata_count_law_locator_preregistration.md'
      - 'scripts/audit_0105a6q2_argon_pseudodata_count_law_locator.py'
      - 'tests/test_0105a6q2_argon_pseudodata_count_law_locator.py'
      - '.github/workflows/nmir_v2_0105a6q2_argon_pseudodata_count_law_locator.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  semantic-locator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check pytest
      - name: Run frozen 0105a6q2 guards
        run: python -m pytest -q tests/test_0105a6q2_argon_pseudodata_count_law_locator.py
      - name: Recover exact 0105a6q1 parent result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/0105a6q2/input/q1
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10166199306/zip \
            > artifacts/0105a6q2/input/q1.zip
          echo 'e3ca7ffe41032b61980c63d6e4e2c7c4be25e21712697dd1fd215284b8dd28bf  artifacts/0105a6q2/input/q1.zip' | sha256sum -c -
          unzip -q artifacts/0105a6q2/input/q1.zip -d artifacts/0105a6q2/input/q1
          echo 'f1d0495fd17ed99fef54086da373a666aa33ef49b3dd61e390297f507b63b201  artifacts/0105a6q2/input/q1/result.json' | sha256sum -c -
      - name: Execute prospectively frozen locator
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/audit_0105a6q2_argon_pseudodata_count_law_locator.py \
            --parent-q1-result artifacts/0105a6q2/input/q1/result.json \
            --thesis artifacts/0105a6q2/input/zettlemoyer_thesis.pdf \
            --output artifacts/0105a6q2/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6q2/stdout.txt
          sha256sum artifacts/0105a6q2/result.json | tee artifacts/0105a6q2/result_sha256.txt
      - name: Remove source inputs before result upload
        if: always()
        run: rm -rf artifacts/0105a6q2/input
      - name: Upload locator result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q2-argon-pseudodata-count-law-locator
          path: |
            artifacts/0105a6q2/result.json
            artifacts/0105a6q2/result_sha256.txt
            artifacts/0105a6q2/stdout.txt
          if-no-files-found: warn
