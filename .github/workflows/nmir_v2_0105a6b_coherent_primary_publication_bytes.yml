name: NMIR v2 0105a6b COHERENT primary publication bytes

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6b_coherent_primary_publication_byte_acquisition.md'
      - 'scripts/audit_0105a6b_coherent_primary_publication_bytes.py'
      - 'tests/test_0105a6b_coherent_primary_publication_bytes.py'
      - '.github/workflows/nmir_v2_0105a6b_coherent_primary_publication_bytes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-primary-publications:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check pytest pypdf
      - name: Run dedicated guards
        run: python -m pytest -q tests/test_0105a6b_coherent_primary_publication_bytes.py
      - name: Acquire and byte-pin exact primary publications
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6b
          python scripts/audit_0105a6b_coherent_primary_publication_bytes.py \
            --output artifacts/0105a6b/primary_publication_byte_manifest.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6b/run_stdout.txt
          sha256sum artifacts/0105a6b/primary_publication_byte_manifest.json | tee artifacts/0105a6b/manifest_sha256.txt
      - name: Upload manifest only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6b-coherent-primary-publication-byte-manifest
          path: |
            artifacts/0105a6b/primary_publication_byte_manifest.json
            artifacts/0105a6b/manifest_sha256.txt
            artifacts/0105a6b/run_stdout.txt
          if-no-files-found: warn
