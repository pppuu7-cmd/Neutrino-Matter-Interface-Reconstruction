name: NMIR v2 0105a6q1 Ar pseudo-data count-law authority

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6q1_argon_central_pseudodata_count_law_authority_preregistration.md'
      - 'scripts/audit_0105a6q1_argon_central_pseudodata_count_law_authority.py'
      - 'tests/test_0105a6q1_argon_central_pseudodata_count_law_authority.py'
      - '.github/workflows/nmir_v2_0105a6q1_argon_central_pseudodata_count_law_authority.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  count-law-authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check pytest
      - name: Run frozen 0105a6q1 guards
        run: python -m pytest -q tests/test_0105a6q1_argon_central_pseudodata_count_law_authority.py
      - name: Recover exact 0105a6q parent result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/0105a6q1/input/q
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10166003795/zip \
            > artifacts/0105a6q1/input/q.zip
          echo '92efaffe13c061c72c54955b6ea62904f68f91aac6d89397926e8a739374732e  artifacts/0105a6q1/input/q.zip' | sha256sum -c -
          unzip -q artifacts/0105a6q1/input/q.zip -d artifacts/0105a6q1/input/q
          echo 'a996df0b6f9d12f03d1fc57cc3d69f13d1b941e3771eb99be9877510d34e6884  artifacts/0105a6q1/input/q/result.json' | sha256sum -c -
      - name: Execute prospectively frozen Q3 authority audit
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/audit_0105a6q1_argon_central_pseudodata_count_law_authority.py \
            --parent-q-result artifacts/0105a6q1/input/q/result.json \
            --thesis artifacts/0105a6q1/input/zettlemoyer_thesis.pdf \
            --output artifacts/0105a6q1/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6q1/stdout.txt
          sha256sum artifacts/0105a6q1/result.json | tee artifacts/0105a6q1/result_sha256.txt
      - name: Remove source inputs before result upload
        if: always()
        run: rm -rf artifacts/0105a6q1/input
      - name: Upload Q3 authority result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q1-argon-pseudodata-count-law-authority
          path: |
            artifacts/0105a6q1/result.json
            artifacts/0105a6q1/result_sha256.txt
            artifacts/0105a6q1/stdout.txt
          if-no-files-found: warn
