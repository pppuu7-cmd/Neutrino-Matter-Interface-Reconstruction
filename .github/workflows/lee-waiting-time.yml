name: NMIR LEE waiting-time requirement gate

on:
  push:
    paths:
      - 'research/prereg/0055_lee_waiting_time_requirement.md'
      - 'src/nmir/lee_waiting_time.py'
      - 'tests/test_lee_waiting_time.py'
      - 'scripts/lee_waiting_time_benchmark.py'
      - '.github/workflows/lee-waiting-time.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_lee_waiting_time.py
      - run: mkdir -p artifacts/lee_waiting_time
      - name: Run fail-closed frozen benchmark
        shell: bash
        run: |
          set -o pipefail
          python scripts/lee_waiting_time_benchmark.py | tee artifacts/lee_waiting_time/result.json
          grep -q 'PASS_WAITING_TIME_REQUIREMENT_MAP' artifacts/lee_waiting_time/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: lee-waiting-time-result
          path: artifacts/lee_waiting_time/result.json
