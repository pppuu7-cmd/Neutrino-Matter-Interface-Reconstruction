name: NMIR v2 0105a6f Ar implementation-contract semantics

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6f_argon_implementation_contract_semantic_closure.md'
      - 'scripts/audit_0105a6f_argon_implementation_contract.py'
      - 'tests/test_0105a6f_argon_implementation_contract.py'
      - '.github/workflows/nmir_v2_0105a6f_argon_implementation_contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout NMIR
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run deterministic guards
        run: python -m pytest -q tests/test_0105a6f_argon_implementation_contract.py
      - name: Acquire exact Ar semantic evidence
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p artifacts/0105a6f
          python scripts/audit_0105a6f_argon_implementation_contract.py \
            --output artifacts/0105a6f/argon_semantic_inventory.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6f/run_stdout.txt
          sha256sum artifacts/0105a6f/argon_semantic_inventory.json \
            | tee artifacts/0105a6f/inventory_sha256.txt
      - name: Upload raw authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6f-argon-semantic-authority
          path: |
            artifacts/0105a6f/argon_semantic_inventory.json
            artifacts/0105a6f/inventory_sha256.txt
            artifacts/0105a6f/run_stdout.txt
