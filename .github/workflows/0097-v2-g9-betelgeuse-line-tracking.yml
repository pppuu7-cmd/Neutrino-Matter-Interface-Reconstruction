name: 0097 v2 G9 Betelgeuse line tracking

on:
  workflow_run:
    workflows: ['0096 v2 G9 Betelgeuse central support']
    types: [completed]
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: 'Authoritative 0096 workflow run id'
        required: true
        type: string
  # One-use auditable infrastructure retry path. This does not alter the
  # preregistered 0097 science inputs, thresholds, formulas, or labels.
  push:
    branches: [main]
    paths:
      - 'research/dispatch/0097_infrastructure_retry.md'

permissions:
  contents: read
  actions: read

jobs:
  gate:
    # For automatic execution, accept only the prospectively identified final
    # 0096 implementation head. workflow_dispatch remains explicit. The push
    # branch is only the one-use dependency-repair marker above and is pinned
    # to the same authoritative 0096 run below.
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.head_sha == 'eff5996612f31c093e82a9ae0cdfdb859da8cb9a'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PARENT_RUN_ID: ${{ github.event_name == 'push' && '34319781596' || (github.event_name == 'workflow_dispatch' && inputs.parent_run_id || github.event.workflow_run.id) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy mpmath
      - name: Download authoritative 0096 parent artifact
        run: |
          mkdir -p parent
          gh run download "$PARENT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name nmir-v2-g9-0096-authoritative \
            --dir parent
          test -f parent/g9_0096_result.json
          sha256sum parent/g9_0096_result.json
      - name: Capture parent artifact id
        run: |
          ARTIFACT_ID=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name=="nmir-v2-g9-0096-authoritative") | .id' | head -n1)
          test -n "$ARTIFACT_ID"
          echo "PARENT_ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"
      - name: Execute frozen 0097 architecture gate
        env:
          PARENT_ARTIFACT_ID: ${{ env.PARENT_ARTIFACT_ID }}
        run: |
          PYTHONPATH=src:scripts python scripts/g9_betelgeuse_line_tracking_0097.py \
            --parent parent/g9_0096_result.json \
            --output g9_0097_result.json
      - name: Hash 0097 authority
        run: sha256sum g9_0097_result.json
      - name: Upload authoritative 0097 result
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-g9-0097-authoritative
          path: g9_0097_result.json
          if-no-files-found: error
