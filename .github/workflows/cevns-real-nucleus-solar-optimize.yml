name: CEvNS real-nucleus full-solar optimization

on:
  push:
    paths:
      - 'data/cevns_target_candidates.csv'
      - 'data/solar_flux_b16.csv'
      - 'data/solar_spectrum_manifest.csv'
      - 'data/be7_bahcall1994_ground_profile.csv'
      - 'research/cevns_real_nucleus_solar_optimization_prereg.md'
      - 'src/nmir/cevns_solar_optimize.py'
      - 'tests/test_cevns_solar_optimize.py'
      - 'scripts/cevns_real_nucleus_solar_optimization.py'
      - '.github/workflows/cevns-real-nucleus-solar-optimize.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run dedicated local regression tests
        run: PYTHONPATH=src python -m pytest -q tests/test_cevns_solar_optimize.py
      - name: Run pinned-source real-nucleus solar optimization
        run: PYTHONPATH=src python scripts/cevns_real_nucleus_solar_optimization.py | tee cevns-real-nucleus-solar.json
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: cevns-real-nucleus-solar-result
          path: cevns-real-nucleus-solar.json
