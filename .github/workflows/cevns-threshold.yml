name: CEvNS threshold scientific gate

on:
  push:
    paths:
      - 'src/nmir/cevns_threshold.py'
      - 'tests/test_cevns_threshold.py'
      - 'scripts/cevns_threshold_benchmark.py'
      - '.github/workflows/cevns-threshold.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run dedicated tests
        run: PYTHONPATH=src python -m pytest -q tests/test_cevns_threshold.py
      - name: Run benchmark
        run: PYTHONPATH=src python scripts/cevns_threshold_benchmark.py | tee cevns-threshold.json
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: cevns-threshold-result
          path: cevns-threshold.json
