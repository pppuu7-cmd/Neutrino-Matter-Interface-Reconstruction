name: 0103 Majorana mu12 basis invariance

on:
  push:
    paths:
      - '.github/workflows/0103-majorana-mu12-basis-invariance.yml'
      - 'scripts/audit_0103_majorana_mu12_basis_invariance.py'
      - 'tests/test_audit_0103_majorana_mu12_basis_invariance.py'
      - 'research/prereg/0103_majorana_mu12_basis_invariance.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Run machine-readable audit
        run: python scripts/audit_0103_majorana_mu12_basis_invariance.py | tee 0103_basis_invariance.json
      - name: Run focused pytest
        run: python -m pytest -q tests/test_audit_0103_majorana_mu12_basis_invariance.py
      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0103-majorana-mu12-basis-invariance
          path: 0103_basis_invariance.json
          if-no-files-found: error
