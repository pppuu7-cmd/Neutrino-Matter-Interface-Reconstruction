name: NMIR 0082b B-L stellar SN vector axis
on:
  push:
    branches: [main]
    paths:
      - 'research/prereg/0082b_bl_stellar_sn_vector_axis_authority.md'
      - 'scripts/audit_bl_stellar_sn_vector_axis_0082b.py'
      - 'tests/test_audit_bl_stellar_sn_vector_axis_0082b.py'
      - '.github/workflows/0082b-bl-stellar-sn-vector-axis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pytest PyMuPDF
      - name: Run dedicated tests
        run: python -m pytest -q tests/test_audit_bl_stellar_sn_vector_axis_0082b.py
      - name: Run frozen 0082b audit
        id: audit
        continue-on-error: true
        run: python scripts/audit_bl_stellar_sn_vector_axis_0082b.py
      - name: Hash result
        if: always()
        run: if [ -f bl_stellar_sn_vector_axis_0082b.json ]; then sha256sum bl_stellar_sn_vector_axis_0082b.json; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0082b-bl-stellar-sn-vector-axis
          path: bl_stellar_sn_vector_axis_0082b.json
          if-no-files-found: error
      - name: Enforce frozen classification
        if: always()
        run: test "${{ steps.audit.outcome }}" = "success"
