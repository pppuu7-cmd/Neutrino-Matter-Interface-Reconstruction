name: NMIR v2 0105a6k1 Zettlemoyer scope numeric refinement

on:
  push:
    branches:
      - research/0105-bsm-residual-reconstruction
    paths:
      - 'research/prereg/0105a6k1_zettlemoyer_scope_numeric_refinement_preregistration.md'
      - 'scripts/audit_0105a6k1_zettlemoyer_scope_numeric_refinement.py'
      - 'tests/test_0105a6k1_zettlemoyer_scope_numeric_refinement.py'
      - '.github/workflows/nmir_v2_0105a6k1_zettlemoyer_scope_numeric_refinement.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  numeric-refinement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run fail-closed numeric guards
        run: python -m pytest -q tests/test_0105a6k1_zettlemoyer_scope_numeric_refinement.py
      - name: Recover exact frozen 0105a6k parent evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/0105a6k1/parent
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10159251542/zip \
            > artifacts/0105a6k1/parent/0105a6k.zip
          echo 'dba1006dd49dc863f8e1cef95c2fbefa424f41c7bc66f93d438f81ad46b49eb4  artifacts/0105a6k1/parent/0105a6k.zip' | sha256sum -c -
          unzip -q artifacts/0105a6k1/parent/0105a6k.zip -d artifacts/0105a6k1/parent/unpacked
          echo '5d12e129e0fcdcea63ae7329e86310e7339162713d62ace7bffab01e5c37ad30  artifacts/0105a6k1/parent/unpacked/result.json' | sha256sum -c -
      - name: Refine scope from numeric page scores only
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/audit_0105a6k1_zettlemoyer_scope_numeric_refinement.py \
            --parent-json artifacts/0105a6k1/parent/unpacked/result.json \
            --output artifacts/0105a6k1/result.json \
            --git-sha "$GITHUB_SHA" \
            | tee artifacts/0105a6k1/stdout.txt
          sha256sum artifacts/0105a6k1/result.json | tee artifacts/0105a6k1/result_sha256.txt
      - name: Upload numeric-refinement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6k1-zettlemoyer-scope-numeric-refinement
          path: |
            artifacts/0105a6k1/result.json
            artifacts/0105a6k1/result_sha256.txt
            artifacts/0105a6k1/stdout.txt
          if-no-files-found: warn
