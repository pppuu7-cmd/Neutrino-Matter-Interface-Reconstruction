name: NMIR 0080e B-L cosmology scenario semantics

on:
  push:
    paths:
      - 'scripts/audit_esseili_kribs_scenario_semantics_0080e.py'
      - 'tests/test_audit_esseili_kribs_scenario_semantics_0080e.py'
      - 'research/prereg/0080e_bl_cosmology_scenario_semantics.md'
      - '.github/workflows/0080e-bl-cosmology-scenario-semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run dedicated tests
        run: python -m pytest -q tests/test_audit_esseili_kribs_scenario_semantics_0080e.py
      - name: Run frozen 0080e primary scenario-semantics audit
        run: python scripts/audit_esseili_kribs_scenario_semantics_0080e.py
      - name: Hash result
        if: always()
        run: |
          if [ -f esseili_kribs_scenario_semantics_0080e.json ]; then sha256sum esseili_kribs_scenario_semantics_0080e.json; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0080e-bl-cosmology-scenario-semantics
          path: esseili_kribs_scenario_semantics_0080e.json
          if-no-files-found: error
