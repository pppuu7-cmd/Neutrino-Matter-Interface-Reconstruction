name: NMIR 0080d B-L CMB conservative excluded geometry

on:
  push:
    paths:
      - 'scripts/extract_esseili_kribs_cmb_excluded_0080d.py'
      - 'tests/test_extract_esseili_kribs_cmb_excluded_0080d.py'
      - 'research/prereg/0080d_bl_cmb_conservative_excluded_geometry.md'
      - '.github/workflows/0080d-bl-cmb-conservative-excluded-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pytest PyMuPDF shapely
      - name: Run dedicated tests
        run: python -m pytest -q tests/test_extract_esseili_kribs_cmb_excluded_0080d.py
      - name: Run frozen 0080d geometry gate
        run: python scripts/extract_esseili_kribs_cmb_excluded_0080d.py
      - name: Hash result
        if: always()
        run: |
          if [ -f esseili_kribs_cmb_excluded_0080d.json ]; then sha256sum esseili_kribs_cmb_excluded_0080d.json; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmir-0080d-bl-cmb-conservative-excluded-geometry
          path: esseili_kribs_cmb_excluded_0080d.json
          if-no-files-found: error
