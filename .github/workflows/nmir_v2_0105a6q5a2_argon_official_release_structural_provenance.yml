name: NMIR v2 0105a6q5a2 Argon structural provenance binding
on:
  push:
    branches: [research/0105-bsm-residual-reconstruction]
    paths:
      - '.github/workflows/nmir_v2_0105a6q5a2_argon_official_release_structural_provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-binding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run dedicated guards
        run: python -m pytest -q tests/test_0105a6q5a2_argon_official_release_structural_provenance.py
      - name: Execute frozen q5a2 gate
        run: |
          mkdir -p artifacts/0105a6q5a2
          python scripts/audit_0105a6q5a2_argon_official_release_structural_provenance.py --output artifacts/0105a6q5a2/result.json --git-sha "$GITHUB_SHA"
      - name: Verify hard guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/0105a6q5a2/result.json'))
          for k in ['release_file_bytes_downloaded','release_file_bytes_rehashed','scientific_release_content_inspected','pseudo_data_generated','likelihood_evaluated','observed_bsm_residual_inspected']:
              assert d[k] is False
          assert d['systematic_monte_carlo_preregistration_permission_percent']==0
          assert d['systematic_monte_carlo_execution_permission_percent']==0
          assert d['observed_bsm_residual_permission_percent']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmir-v2-0105a6q5a2-argon-structural-provenance
          path: artifacts/0105a6q5a2/result.json
          if-no-files-found: error
          retention-days: 90
